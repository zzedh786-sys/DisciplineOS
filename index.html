<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triage OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Triage OS: a gamified Discipline OS for habits and tasks that flexes around shift work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow terminal column floating over a frozen low-poly world; panels are chamfered OS windows with black title bars. */
:root{
  --bg:#e8e7e4; --bg2:#d9d8d4; --panel:rgba(246,246,244,.93); --panel-solid:#f6f6f4;
  --ink:#0b0b0c; --mute:#6b6a68; --line:#c6c5c1; --line2:#a3a29e;
  --red:#e2231a; --red-deep:#9c0c0c; --red-pale:rgba(226,35,26,.55); --red-ghost:rgba(226,35,26,.10); --on-red:#ffffff;
  --shard1:#ffffff; --shard2:#d3d2ce; --shard3:#bdbcb7; --shard-a:1;
  --scrim:rgba(10,10,10,.55);
  --term-bg:#060606; --term-fg:#e6e6e3; --term-dim:#7d7d79;
  --lv-routine:var(--red-pale); --lv-semi:var(--red); --lv-urgent:var(--red-deep); --lv-arrest:var(--red-deep);
  --font-h:'Anton','Impact','Haettenschweiler','Arial Narrow Bold','DIN Condensed','Avenir Next Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
  --cut:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050505; --bg2:#1a1a1a; --panel:rgba(14,14,14,.93); --panel-solid:#0e0e0e;
    --ink:#f2f2f0; --mute:#8f8e8a; --line:#2b2b2b; --line2:#4a4a48;
    --red:#ff2b20; --red-deep:#c8140d; --red-pale:rgba(255,43,32,.6); --red-ghost:rgba(255,43,32,.13); --on-red:#ffffff;
    --shard1:#f2f2f0; --shard2:#9a9a98; --shard3:#555553; --shard-a:.13;
    --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050505; --bg2:#1a1a1a; --panel:rgba(14,14,14,.93); --panel-solid:#0e0e0e;
  --ink:#f2f2f0; --mute:#8f8e8a; --line:#2b2b2b; --line2:#4a4a48;
  --red:#ff2b20; --red-deep:#c8140d; --red-pale:rgba(255,43,32,.6); --red-ghost:rgba(255,43,32,.13); --on-red:#ffffff;
  --shard1:#f2f2f0; --shard2:#9a9a98; --shard3:#555553; --shard-a:.13;
  --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
/* Manchester Triage colour option */
:root[data-mts="1"]{ --lv-routine:#2f9d4f; --lv-semi:#e2b100; --lv-urgent:#ee7411; --lv-arrest:#e2231a; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-m);-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#bg{z-index:0}
#fx{z-index:95}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* ---------- HUD ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px;border-bottom:2px solid var(--ink)}
.bar{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--font-h);font-size:24px;line-height:1;background:none;border:0;padding:0;letter-spacing:.01em;white-space:nowrap;font-synthesis:none}
.logo span{background:var(--ink);color:var(--bg);padding:0 5px;margin-left:4px}
.xpchip{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lv{font-family:var(--font-h);font-size:10px;line-height:1;text-align:center;letter-spacing:.08em}
.lv b{display:block;font-size:24px;font-weight:400;letter-spacing:0}
.xpbody{flex:1;min-width:0}
.rank{font-family:var(--font-h);font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.xpbar{height:8px;background:var(--bg2);margin-top:4px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.xpbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.xpn{font-family:var(--font-h);font-size:17px;font-variant-numeric:tabular-nums;line-height:1}
.xpn small{display:block;font-family:var(--font-m);font-size:9px;letter-spacing:.1em;color:var(--mute)}
.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.chain{display:flex;align-items:center;gap:5px;background:none;border:0;padding:0}
.chain b{font-family:var(--font-h);font-size:28px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.chain small{font-size:9px;line-height:1.1;letter-spacing:.1em;text-align:left}
#prompt{display:flex;align-items:center;gap:6px;margin-top:9px;box-shadow:inset 0 0 0 1.5px var(--ink);padding:0 10px;height:40px;background:var(--panel-solid)}
#prompt label{font-size:12px;color:var(--mute);white-space:nowrap}
#cmd{flex:1;min-width:0;border:0;box-shadow:none;min-height:0;height:100%;background:transparent;color:var(--ink);font:16px var(--font-m);outline:none;padding:0}
#cmd::placeholder{color:var(--mute)}
.caret{width:9px;height:18px;background:var(--ink);animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- NAV ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#nav .in{display:flex;overflow-x:auto;scrollbar-width:none;max-width:812px;margin:0 auto;padding:0 8px}
#nav .in::-webkit-scrollbar{display:none}
#nav button{flex:1 0 auto;background:none;border:0;color:var(--bg);font:12px var(--font-m);padding:10px 10px;min-height:56px;position:relative;opacity:.62;white-space:nowrap}
#nav button b{display:block;font-family:var(--font-h);font-weight:400;font-size:15px;letter-spacing:.04em;opacity:1}
#nav button.on{opacity:1;background:var(--bg);color:var(--ink)}
#nav .badge{position:absolute;top:6px;right:4px;min-width:16px;height:16px;padding:0 4px;font:600 10px/16px var(--font-m);background:var(--red);color:var(--on-red);text-align:center}

/* ---------- PANELS ---------- */
.panel{background:var(--panel);margin-top:14px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:var(--bg);padding:6px 22px 6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ph b{font-weight:600}
.pb{padding:14px 12px 16px;display:grid;gap:14px}
.pb>*{min-width:0}
.h1{font-family:var(--font-h);font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.92;text-transform:uppercase;margin:0;text-wrap:balance;font-synthesis:none}
.h2{font-family:var(--font-h);font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;margin:0;letter-spacing:.01em;font-synthesis:none}
.h3{font-family:var(--font-h);font-weight:400;font-size:18px;line-height:1.05;text-transform:uppercase;margin:0;letter-spacing:.02em;font-synthesis:none}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.label b{color:var(--ink);font-weight:600}
.mute{color:var(--mute)}
.small{font-size:12px}
p{margin:0}
.line{border-left:4px solid var(--ink);padding:2px 0 2px 10px;font-size:14px;max-width:62ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 160px}
.stack{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:15px;letter-spacing:.03em;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;color:var(--ink);padding:7px 11px;min-height:42px;text-align:left;line-height:1.05;font-synthesis:none}
.chip small{display:block;font-family:var(--font-m);font-size:10px;letter-spacing:.04em;opacity:.7;text-transform:none}
.chip.on{background:var(--ink);color:var(--bg)}
.btn{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:16px;letter-spacing:.04em;background:var(--ink);color:var(--bg);border:0;padding:9px 14px;min-height:44px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));white-space:nowrap;font-synthesis:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);clip-path:none}
.btn.sm{font-size:14px;min-height:38px;padding:6px 10px}
.btn.big{font-size:22px;min-height:58px;width:100%;white-space:normal;line-height:1.05}
.btn.threat{background:var(--red);color:var(--on-red)}
.btn:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:12px;color:var(--mute)}
input,textarea,select{font:16px var(--font-m);color:var(--ink);background:var(--bg);border:0;box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:0;padding:9px 10px;width:100%;min-width:0;min-height:44px}
textarea{min-height:68px;resize:vertical;line-height:1.4}
select{appearance:none;-webkit-appearance:none;background-image:none;padding-right:26px}
.sel{position:relative}
.sel::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
input[type=checkbox]{width:auto;min-height:0;box-shadow:none}
.field{display:grid;gap:4px}
.field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
details>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"− "}
hr{border:0;border-top:1.5px dashed var(--line2);margin:0}

/* ---------- HIGHLIGHT ---------- */
.hl{position:relative;padding:14px 12px 14px 62px;box-shadow:inset 0 0 0 2px var(--red);display:grid;gap:10px;background:var(--red-ghost)}
.hl .gem{position:absolute;left:12px;top:14px;width:38px;height:38px;color:var(--red)}
.hl .t{font-family:var(--font-h);font-size:clamp(24px,7vw,36px);text-transform:uppercase;line-height:.98;overflow-wrap:anywhere;font-synthesis:none}
.hl.done{box-shadow:inset 0 0 0 2px var(--ink);background:transparent}
.hl.done .gem{color:var(--line2)}
.hl.done .t{text-decoration:line-through;text-decoration-thickness:3px}
.stamp{display:inline-block;font-family:var(--font-h);font-size:15px;letter-spacing:.06em;padding:2px 8px;box-shadow:inset 0 0 0 2px var(--ink);transform:rotate(-2deg);font-synthesis:none}

/* ---------- TARGET SUMMARY ---------- */
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsum button{background:var(--panel-solid);border:0;box-shadow:inset 0 0 0 1.5px var(--line2);padding:10px;text-align:left;display:grid;gap:6px}
.tsum .n{font-family:var(--font-h);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tsum .n small{font-size:16px;color:var(--mute)}
.pips{display:flex;flex-wrap:wrap;gap:5px}
.pips i{display:inline-block;width:10px;height:10px;transform:rotate(45deg);box-shadow:inset 0 0 0 1.5px var(--red)}
.pips i.on{background:var(--red)}
.threatline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:0;text-align:left}
.threatline b{font-family:var(--font-h);font-weight:400;font-size:20px;vertical-align:-2px;margin-right:3px}
.threatline .r{color:var(--red)}

/* ---------- TASK CARDS & FIGURES ---------- */
.lv-none{--fc:var(--mute)}
.lv-routine{--fc:var(--lv-routine)}
.lv-semi{--fc:var(--lv-semi)}
.lv-urgent{--fc:var(--lv-urgent)}
.lv-arrest{--fc:var(--lv-arrest)}
.tcard{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px 8px 6px;background:var(--panel-solid);box-shadow:inset 0 0 0 1px var(--line)}
.tcard.arrest{box-shadow:inset 0 0 0 2px var(--lv-arrest)}
.tcard.dragging{opacity:.3}
.tcard.done{opacity:.6}
.fig{width:42px;height:54px;color:var(--fc);touch-action:none;cursor:grab;display:grid;place-items:center;background:none;border:0;padding:0}
.fig svg{width:36px;height:52px;overflow:visible;display:block}
.fig svg polygon{fill:currentColor}
.fig .f2{opacity:.78}.fig .f3{opacity:.56}
.fig .frac{display:none;fill:none;stroke:var(--panel-solid);stroke-width:1.3;stroke-linejoin:bevel}
.f-routine polygon{fill:none!important;stroke:currentColor;stroke-width:1.3;stroke-linejoin:bevel;opacity:1!important}
.f-none polygon{fill:none!important;stroke:currentColor;stroke-width:1.2;stroke-dasharray:2 2;opacity:1!important}
.f-urgent .frac{display:inline}
.f-semi{transform-origin:50% 50%;animation:turn 6s ease-in-out infinite alternate}
@keyframes turn{0%{transform:scaleX(.32) skewY(7deg)}75%,100%{transform:scaleX(1) skewY(0)}}
.f-urgent{transform-origin:50% 100%;animation:advance 1.3s ease-in-out infinite;filter:drop-shadow(0 0 3px var(--fc))}
@keyframes advance{0%,100%{transform:scale(.9) translateY(2px);filter:drop-shadow(0 0 2px var(--fc))}50%{transform:scale(1.07) translateY(0);filter:drop-shadow(0 0 9px var(--fc))}}
.ttitle{font-weight:600;line-height:1.25;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;width:100%}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.tmeta .hot{color:var(--fc);font-weight:600}
.peri{background:var(--lv-arrest);color:var(--on-red);font-family:var(--font-h);font-size:12px;letter-spacing:.08em;padding:1px 6px;animation:blink 1s steps(2) infinite}
.tag{box-shadow:inset 0 0 0 1px currentColor;padding:0 5px;color:var(--fc)}
.tacts{display:flex;gap:6px}
.ico{width:42px;height:42px;display:grid;place-items:center;background:transparent;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);font-size:18px;line-height:1;padding:0}
.ico.solid{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.empty{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;padding:10px;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.wr .tri{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.wr .tri .btn{flex:1 1 80px}
.board{display:grid;gap:12px}
@media (min-width:720px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{padding:8px;min-height:96px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;gap:8px;align-content:start;transition:background .1s}
.col.over{box-shadow:inset 0 0 0 3px var(--fc);background:var(--red-ghost)}
.colh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.colh .fig{width:26px;height:34px;cursor:default}
.colh .fig svg{width:22px;height:32px}
.colh .h3{flex:1}
.colh .ct{font-family:var(--font-h);font-size:22px}
.dragghost{position:fixed;z-index:96;pointer-events:none;opacity:.92;transform:rotate(-2.5deg) scale(1.03);box-shadow:0 0 0 2px var(--ink)}

/* ---------- HABITS ---------- */
.lvh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.lvh .h2 small{display:block;font-family:var(--font-m);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.hrow{display:grid;grid-template-columns:50px minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px;background:var(--panel-solid);box-shadow:inset 0 0 0 1px var(--line)}
.hrow.next{box-shadow:inset 0 0 0 2px var(--ink)}
.hrow.queued .target{opacity:.5}
.hrow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hrow .acts .btn{flex:1 1 120px}
@media (min-width:620px){.hrow{grid-template-columns:50px minmax(0,1fr) auto}.hrow .acts{grid-column:auto;margin-top:0;flex-direction:column;min-width:150px}}
.target{width:50px;height:50px;color:var(--red);background:none;border:0;padding:0}
.target svg{width:50px;height:50px;display:block;overflow:visible}
.tg .o{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:bevel}
.tg .m{fill:currentColor;opacity:.28}
.tg .i{fill:currentColor}
.tg .ck,.tg .cr{display:none;fill:none;stroke-linejoin:bevel}
.tg-next{animation:tpulse 1.8s ease-in-out infinite}
@keyframes tpulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
.tg-cleared{color:var(--line2)}
.tg-cleared .ck{display:inline;stroke:var(--ink);stroke-width:3.2}
.tg-cracked .cr{display:inline;stroke:var(--panel-solid);stroke-width:2}
.tg-shattered .o{stroke-dasharray:7 5}
.tg-shattered .m{transform:translate(3px,-2px) rotate(8deg);transform-origin:center}
.tg-shattered .i{transform:translate(-3px,3px) rotate(-14deg);transform-origin:center}
.hn{font-family:var(--font-h);font-size:21px;text-transform:uppercase;line-height:1;overflow-wrap:anywhere;font-synthesis:none}
.cue{font-size:12px;color:var(--mute);margin-top:4px}
.cue b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.meta .st{color:var(--ink);font-weight:600}
.meta .warn{color:var(--red);font-weight:600}
.ver{font-size:12px;margin-top:5px;line-height:1.35}
.ver .tgt{font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.cleared-stamp{font-family:var(--font-h);font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-synthesis:none}
.votes{display:grid;gap:6px}
.vote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.vote b{font-family:var(--font-h);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.law{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:12px}
.law dt{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mute)}
.law dd{margin:0}
.bad{padding:10px;background:var(--panel-solid);box-shadow:inset 0 0 0 1.5px var(--red);display:grid;gap:8px}

/* ---------- WEEK / MONTH ---------- */
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rooms{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.room{background:none;border:0;padding:4px 0;text-align:center;display:grid;gap:2px;justify-items:center}
.room svg{width:100%;max-width:64px;height:auto;display:block}
.room .d{font-family:var(--font-h);font-size:15px;letter-spacing:.04em}
.room .n{font-size:11px;font-variant-numeric:tabular-nums}
.room .lo{font-size:10px;color:var(--mute);letter-spacing:.06em;min-height:14px}
.room.today{box-shadow:inset 0 0 0 2px var(--ink)}
.room.fut{opacity:.4}
.rm-wall{fill:var(--shard1)}.rm-floor{fill:var(--shard2)}.rm-side{fill:var(--shard3)}
.rm-edge{fill:none;stroke:var(--line2);stroke-width:.8}
.rm-t{fill:var(--red)}.rm-o{fill:none;stroke:var(--line2);stroke-width:.9}
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{box-shadow:inset 0 0 0 1.5px var(--line2);padding:8px 10px}
.stat b{display:block;font-family:var(--font-h);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.scroll-x{overflow-x:auto}
table.hg{border-collapse:collapse;width:100%;font-size:12px}
.hg th,.hg td{padding:5px 2px;text-align:center}
.hg th{font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--mute)}
.hg th.hn2{text-align:left;font-family:var(--font-m);font-size:12px;color:var(--ink);font-weight:400;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.hg tr+tr td,.hg tr+tr th{border-top:1px solid var(--line)}
.c{display:inline-block;width:16px;height:16px;vertical-align:middle}
.c.full{background:var(--red)}
.c.min{background:var(--red);clip-path:polygon(0 100%,100% 0,100% 100%)}
.c.miss{color:var(--mute);font-size:13px;line-height:16px}
.c.off{color:var(--line2);line-height:16px}
.c.pend{box-shadow:inset 0 0 0 1.5px var(--red)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--mute);align-items:center}
.key .c{width:12px;height:12px;margin-right:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mh{text-align:center;font-size:10px;letter-spacing:.1em;color:var(--mute)}
.mday{position:relative;background:none;border:0;padding:0;aspect-ratio:1/1.15;max-width:100%}
.mday svg{width:100%;height:100%;display:block}
.mday .dn{position:absolute;left:3px;top:1px;font-size:10px;font-variant-numeric:tabular-nums;color:var(--mute)}
.mday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.mday.fut{opacity:.35}
.pl-top{fill:var(--shard1)}.pl-l{fill:var(--shard2)}.pl-r{fill:var(--shard3)}
.pl-edge{fill:none;stroke:var(--line2);stroke-width:.6}
.cr-a{fill:var(--red)}.cr-b{fill:var(--red-deep)}.cr-c{fill:var(--red-pale)}
.gl{fill:var(--shard1);opacity:.35;animation:glint 3.4s infinite}
@keyframes glint{0%,84%,100%{opacity:.3}91%{opacity:1}}

/* ---------- HANDOVER ---------- */
.sbar{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
.sbar .L{font-family:var(--font-h);font-size:44px;line-height:.85;text-align:center;font-synthesis:none}
.sbar .field>span b{color:var(--ink)}
.sbar-read{white-space:pre-wrap;font-size:13px}

.chip.pick{font-family:var(--font-m);font-size:13px;text-transform:none;letter-spacing:0;min-height:38px}
.chip.pick.on{background:var(--ink);color:var(--bg)}
.chip.pick.ex.on{background:var(--red);color:var(--on-red);box-shadow:none}
.fixes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.fixes li{font-size:12px;padding-left:16px;position:relative}
.fixes li::before{content:"→";position:absolute;left:0}
.fixes:empty{display:none}

/* ---------- OVERLAYS ---------- */
.ov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#boot{background:var(--term-bg);color:var(--term-fg);z-index:100;font-size:13px;justify-content:flex-end;transition:opacity .16s}
#boot.off{opacity:0}
#boot .out{display:grid;gap:3px;max-width:640px}
#boot .ok{color:var(--term-fg)}
#boot .dim{color:var(--term-dim)}
#boot .bad{color:#ff3b30;background:none;box-shadow:none;padding:0;display:inline}
#boot .big{font-family:var(--font-h);font-size:clamp(40px,13vw,88px);line-height:.9;margin-bottom:12px;letter-spacing:.01em}
#boot .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--term-dim);font-size:11px;letter-spacing:.12em}
#laser{background:var(--bg);justify-content:center;align-items:center;text-align:center;gap:18px;overflow:hidden}
#laser .lt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#laser .lbl{font-family:var(--font-h);font-size:clamp(22px,6vw,38px);text-transform:uppercase;line-height:1;max-width:18ch;text-wrap:balance;overflow-wrap:anywhere;font-synthesis:none}
#laser .clock{font-family:var(--font-h);font-size:clamp(84px,30vw,220px);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-synthesis:none}
#laser .prog{width:min(420px,100%);height:6px;background:var(--bg2)}
#laser .prog i{display:block;height:100%;background:var(--ink);width:0}
#laser .msg{min-height:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#laser .crk{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#laser .row{justify-content:center}
#laser > *:not(svg){position:relative;z-index:1}
#cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#cracks path{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:bevel;opacity:.8}
#cracks .ring{stroke-width:.9;opacity:.55}
#cracks .hole{fill:var(--ink);stroke:none;opacity:.85}
#chant{background:var(--bg);justify-content:center;align-items:center;z-index:97;text-align:center;gap:0;cursor:pointer}
#chant.inv{background:var(--ink)}
#chant.inv .w{color:var(--bg)}
#chant .w{font-family:var(--font-h);font-size:clamp(70px,24vw,240px);line-height:.86;text-transform:uppercase;letter-spacing:-.005em;visibility:hidden;font-synthesis:none;overflow-wrap:anywhere;max-width:100%}
#chant .w.in{visibility:visible;animation:slam .14s ease-out}
@keyframes slam{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
#replay{background:var(--bg);z-index:96;gap:12px}
#replay .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
#replay .rh .h2{font-size:26px}
#replay .ff{font-family:var(--font-h);font-size:20px;letter-spacing:.04em}
#replay .rl{flex:1;overflow:auto;display:grid;gap:4px;align-content:start;max-width:640px;width:100%}
#replay .ri{display:grid;grid-template-columns:48px 18px minmax(0,1fr) auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);animation:rin .12s ease-out}
#replay .ri .g{color:var(--red)}
#replay .ri .x{font-variant-numeric:tabular-nums;font-weight:600}
@keyframes rin{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
#replay .tot{font-family:var(--font-h);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;z-index:92;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:600px;max-height:90vh;overflow:auto;background:var(--panel-solid);padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
@media (min-width:640px){#modal{align-items:center}#modal .sheet{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}}
#modal .mb{padding:14px max(16px,env(safe-area-inset-left,0px)) 0;display:grid;gap:12px}
#modal .mb>*{min-width:0}
#toast{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:98;background:var(--ink);color:var(--bg);padding:10px 14px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.35;pointer-events:none}
#toast.in{animation:tin .16s ease-out}
@keyframes tin{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- WORLD.EXE ---------- */
body.in-world #app,body.in-world #nav,body.in-world #bg,body.in-world #fx{visibility:hidden}
#world{padding:0;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;z-index:91}
#wcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.whud{position:absolute;inset:0;pointer-events:none}
.wtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wroom{flex:1;min-width:0;font-family:var(--font-h);font-size:24px;line-height:1;text-transform:uppercase;color:var(--ink);font-synthesis:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wroom small{display:block;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.wxp{font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wtop .btn{pointer-events:auto}
.xh{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
.xh::before,.xh::after{content:"";position:absolute;background:var(--ink)}
.xh::before{left:10px;top:0;width:2px;height:22px}
.xh::after{top:10px;left:0;height:2px;width:22px}
.xh.on::before,.xh.on::after{background:var(--red)}
.whint{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:4px 8px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.whint:empty{display:none}
.wkeys{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.6}
.joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:128px;height:128px;box-shadow:inset 0 0 0 2px var(--ink);background:var(--panel);pointer-events:auto;touch-action:none;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:var(--ink);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
@media (pointer:fine){.joy{display:none}}
@media (pointer:coarse){.wkeys{display:none}}
#world.panel-open .joy{display:none}
.wpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--panel-solid);box-shadow:inset 0 0 0 2px var(--ink);padding:14px;display:grid;gap:10px;pointer-events:auto;max-height:60vh;overflow:auto}
.wpanel .row .btn{flex:1 1 120px}
.wload{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--font-h);font-size:28px;line-height:1.1;background:var(--bg);color:var(--ink);pointer-events:auto;text-transform:uppercase;font-synthesis:none}
.wload small{display:block;font-family:var(--font-m);font-size:12px;letter-spacing:.08em;color:var(--mute);margin-top:10px;text-transform:none}

/* Reduced motion */
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
.rm #chant .w{visibility:visible}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="app">
  <header id="hud">
    <div class="bar">
      <button class="logo" data-act="nav" data-v="today" aria-label="Today">TRIAGE<span>OS</span></button>
      <div id="xpChip" class="xpchip" aria-live="polite">
        <div class="lv">LV<b id="lvN">1</b></div>
        <div class="xpbody"><div class="rank" id="rank">MED STUDENT</div><div class="xpbar"><i id="xpFill"></i></div></div>
        <div class="xpn" id="xpN">0<small>XP</small></div>
      </div>
      <button class="chain" data-act="nav" data-v="month" aria-label="Day chain"><b id="chainN">0</b><small>DAY<br>CHAIN</small></button>
    </div>

      <label for="cmd">C:\TRIAGE&gt;</label>

</div></nav>

<div id="boot" class="ov" role="status" aria-live="polite">

</div>

</div>

</div>

    <div class="wtop"><div class="wroom" id="wRoom">THE WAITING ROOM<small></small></div><div class="wxp" id="wXp"></div><button class="btn sm" data-act="w-exit">EXIT</button></div>
    <div class="xh" id="wXh" aria-hidden="true"></div>

</div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const KEY = 'triageos.v1';
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmtKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return fmtKey(d); };
const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const dateLong = k => { const d = keyToDate(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const hhmm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const toLocalInput = ms => { if (!ms) return ''; const d = new Date(ms); return `${fmtKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = ms => {
  const a = Math.abs(ms), m = Math.floor(a / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return `${d}d ${h % 24}h`;
  if (h >= 1) return `${h}h ${m % 60}m`;
  return `${Math.max(m, 0)}m`;
};
const vibrate = n => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };

/* =========================================================
   Defaults (editable starter data)
   ========================================================= */
const LO_IDS = ['day', 'long', 'nights', 'post', 'off'];
const DEFAULT_CATS = [
  { id: 'health', name: 'Health', sub: 'move · fuel · daylight' },
  { id: 'study', name: 'Clinical & Study', sub: 'AKT · portfolio · training' },
  { id: 'create', name: 'Create', sub: 'script · film · edit' },
  { id: 'admin', name: 'Life Admin', sub: 'rota · forms · errands' },
  { id: 'finance', name: 'Finance', sub: 'money · pension · bills' },
  { id: 'spirit', name: 'Mind & Spirit', sub: 'stillness · gratitude · faith' },
  { id: 'sleep', name: 'Sleep & Recovery', sub: 'wind-down · rest' },
];
const HCAT = { 'h-light': 'health', 'h-train': 'health', 'h-akt': 'study', 'h-still': 'spirit', 'h-nophone': 'spirit', 'h-food': 'health', 'h-content': 'create', 'h-eport': 'study', 'h-money': 'finance', 'h-wind': 'sleep', 'h-phone': 'sleep' };
const DEFAULT_EXCUSES = ["I wasn't feeling like it", 'Too tired from work', 'Doomscrolling', 'No time', 'Shift overran', 'Forgot', 'The plan was too big'];
const EXCUSE_FIX = {
  "i wasn't feeling like it": 'Motivation follows action. Tomorrow, start the 2-minute version and let the feeling catch up.',
  'too tired from work': "Tired is allowed. Make tomorrow's target the 2-minute minimum and protect sleep tonight.",
  'doomscrolling': 'Make it difficult: phone in another room before the next block. Log the urge when it hits.',
  'no time': 'Give it a time and a place. Without both it is a wish, not a plan.',
  'shift overran': "Shifts overrun. Switch tomorrow's loadout so the targets fit the day you actually have.",
  'forgot': 'Make it obvious: stack it onto something you already do every day.',
  'the plan was too big': "Shrink it. A small Highlight you finish beats a big one you don't.",
};
const fixFor = e => EXCUSE_FIX[String(e).toLowerCase().trim()] || 'Name the friction, then remove one piece of it before tomorrow.';
const XP_TASK = { routine: 10, semi: 20, urgent: 35 };
const XP_HL = 50, XP_HANDOVER = 15, XP_URGE = 5, URGE_CAP = 5;
const LV_NAME = { routine: 'ROUTINE', semi: 'SEMI-URGENT', urgent: 'URGENT' };
const RANKS = ['MED STUDENT', 'FY1', 'FY2', 'GPST1', 'GPST2', 'GPST3', 'CCT', 'GP', 'PARTNER', 'SENIOR PARTNER', 'CLINICAL LEAD', 'LEGEND'];

function rawTodayKey(rollover) { return fmtKey(new Date(Date.now() - rollover * 3600e3)); }

function defaults() {
  const now = Date.now(), H = 3600e3, D = 864e5;
  const tk = rawTodayKey(4);
  const hb = (id, routine, name, full, min, cue, time, loc, identity, xp = 20) => ({ id, routine, name, full, min, cue, time, loc, identity, xp, since: tk });
  const habits = [
    hb('h-light', 'am', 'Daylight + water', '10 min outside light and 500 ml water', 'Open the curtains and drink one glass', 'After my alarm goes off', 'On waking', 'Window / outside', 3, 15),
    hb('h-train', 'am', 'Train', '30 min gym, run or home circuit', '10 press-ups and 10 squats', 'After I get dressed', '07:00', 'Living room', 0, 25),
    hb('h-akt', 'am', 'AKT revision', '40 AKT questions, then review the wrong ones', '5 questions', 'After I pour my coffee', '07:30', 'Kitchen table', 1, 25),
    hb('h-still', 'am', 'Stillness', '5 min prayer, meditation or gratitude journal', 'Write one line of gratitude', 'After I finish my coffee', 'Morning', 'Quiet corner', 4, 15),

  for (const f of BG.floor) { x.fillStyle = fills[f.k]; poly(x, f.p); x.fill(); }
  // suspended clock
  const cx = w * 0.74, cy = h * 0.3, r = Math.min(w, h) * 0.2;
  x.globalAlpha = C.a < 1 ? 0.35 : 0.55;
  x.strokeStyle = C.line; x.lineWidth = 2;
  const oct = []; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + Math.PI / 8; oct.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }

    const a = i / 12 * Math.PI * 2, rr = r * 0.86, s = i % 3 ? 3 : 6;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    poly(x, [[px + Math.cos(a) * s, py + Math.sin(a) * s], [px + Math.cos(a + 2.2) * s * 0.6, py + Math.sin(a + 2.2) * s * 0.6], [px + Math.cos(a - 2.2) * s * 0.6, py + Math.sin(a - 2.2) * s * 0.6]]); x.fill();
  }
  const t = new Date(BG.t0 + BG.sim * 1000);
  const sec = t.getSeconds() + t.getMilliseconds() / 1000, min = t.getMinutes() + sec / 60, hr = (t.getHours() % 12) + min / 60;
  const hand = (frac, len, wd) => { const a = frac * Math.PI * 2 - Math.PI / 2; x.lineWidth = wd; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len); x.stroke(); };

  x.strokeStyle = C.red; x.globalAlpha = 0.5; hand(sec / 60, r * 0.78, 1.5);

  }
  // threat projectiles: trail length = deadline proximity
  const now = Date.now();
  BG.threats.forEach((tk, i) => {
    const st = BG.proj.get(tk.id) || { x: (hash(tk.id) % 1000) / 1000 * w };
    const p = projProgress(tk, now), over = now >= tk.deadline;
    const y = h * (0.12 + ((hash(tk.id) % 1000) / 1000) * 0.55) + i * 7;
    const trail = 30 + p * Math.min(w * 0.7, 520);
    const seg = 8;
    x.lineWidth = over ? 3 : 2;
    for (let j = 0; j < seg; j++) {
      x.globalAlpha = (1 - j / seg) * 0.55;
      x.strokeStyle = C.red;
      x.beginPath(); x.moveTo(st.x - trail * j / seg, y); x.lineTo(st.x - trail * (j + 1) / seg, y); x.stroke();
    }
    x.globalAlpha = 1; x.fillStyle = over ? C.red : C.deep;
    const L = over ? 16 : 12, W = over ? 5 : 4;
    poly(x, [[st.x + L, y], [st.x, y - W], [st.x - L * 0.6, y], [st.x, y + W]]); x.fill();
  });

}
function bgLoop(t) {
  const dt = BG.last ? Math.min(0.05, (t - BG.last) / 1000) : 0.016;

/* =========================================================
   FX overlay: shatter into the XP counter
   ========================================================= */
const FX = { c: null, x: null, parts: [], on: false };
function fxResize() { const d = Math.min(2, devicePixelRatio || 1); FX.c.width = innerWidth * d; FX.c.height = innerHeight * d; FX.x.setTransform(d, 0, 0, d, 0, 0); }
function bumpXP() { const el = $('#xpChip'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function shatter(rect, color) {
  if (!rect) { bumpXP(); return; }
  if (rm()) { bumpXP(); return; }
  const tg = $('#xpN').getBoundingClientRect();
  const tx = tg.left + tg.width / 2, ty = tg.top + tg.height / 2, now = performance.now();
  const col = color || BG.col.red;
  for (let i = 0; i < 24; i++) {
    const s = 3 + Math.random() * 9;
    FX.parts.push({ x0: rect.left + Math.random() * rect.width, y0: rect.top + Math.random() * rect.height, ox: (Math.random() - 0.5) * 220, oy: (Math.random() - 0.5) * 160 - 60, tx, ty, s, r: Math.random() * 6, vr: (Math.random() - 0.5) * 18, t0: now + Math.random() * 50, d: 520 + Math.random() * 200, col: Math.random() < 0.25 ? BG.col.s1 : col, p: [[0, -s], [s * 0.9, s * 0.6], [-s * 0.7, s * 0.5]] });
  }
  setTimeout(bumpXP, 560);
  if (!FX.on) { FX.on = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(now) {
  const x = FX.x; x.clearRect(0, 0, innerWidth, innerHeight);
  FX.parts = FX.parts.filter(p => now < p.t0 + p.d);
  for (const p of FX.parts) {
    const k = clamp((now - p.t0) / p.d, 0, 1);
    const u = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const cx = p.x0 + p.ox, cy = p.y0 + p.oy;
    const px = (1 - u) * (1 - u) * p.x0 + 2 * (1 - u) * u * cx + u * u * p.tx;
    const py = (1 - u) * (1 - u) * p.y0 + 2 * (1 - u) * u * cy + u * u * p.ty;
    const a = p.r + p.vr * k, c = Math.cos(a), sn = Math.sin(a), sc = 1 - k * 0.65;
    x.fillStyle = p.col; x.globalAlpha = 1;
    poly(x, p.p.map(([q, w]) => [px + (q * c - w * sn) * sc, py + (q * sn + w * c) * sc])); x.fill();
  }
  if (FX.parts.length) requestAnimationFrame(fxLoop); else { FX.on = false; x.clearRect(0, 0, innerWidth, innerHeight); }
}

   ========================================================= */
let completions = 0;
function award(kind, ref, label, xp, rect, msg, color) {
  const rec = day(), before = lvl(S.xp).L;
  rec.log.push({ t: Date.now(), kind, ref, label, xp });
  S.xp += xp; save(); hud();
  snap(); sfxGlass(xp >= 30 ? 1.2 : 0.8); vibrate(14);
  shatter(rect, color);
  completions++;
  const after = lvl(S.xp).L;
  let m = msg || `+${xp} XP`;
  if (after > before) m = `LEVEL ${after} · PROMOTED TO ${rankOf(after)}`;
  else if (completions % 3 === 0) { const l = pickLine(); if (l) m = `${m} — ${l}`; }
  toast(m, m.length > 70 ? 3600 : 2400);
}
function revoke(kind, ref, k = todayKey()) {
  const rec = S.days[k]; if (!rec) return;
  for (let i = rec.log.length - 1; i >= 0; i--) {
    const e = rec.log[i];
    if (e.kind === kind && e.ref === ref) { S.xp = Math.max(0, S.xp - e.xp); rec.log.splice(i, 1); break; }
  }
  save(); hud();
}

function roomSVG(st, k) {

    const cx = 10 + (i % 3) * 10 + (R() - 0.5) * 2, cy = 13 + Math.floor(i / 3) * 6.2;
    const pts = `${cx},${cy - 2.6} ${cx + 2.8},${cy + 2} ${cx - 2.8},${cy + 2}`;
    tg += `<polygon class="${i < st.cleared ? 'rm-t' : 'rm-o'}" points="${pts}"/>`;
  }
  return `<svg viewBox="0 0 40 56" aria-hidden="true">
    <polygon class="rm-side" points="0,3 4,8 4,44 0,55"/><polygon class="rm-side" points="40,3 36,8 36,44 40,55"/>
    <polygon class="rm-wall" points="4,8 36,8 36,44 4,44"/><polygon class="rm-floor" points="4,44 36,44 40,55 0,55"/>
    <polygon class="rm-edge" points="4,8 36,8 36,44 4,44"/>${tg}
    ${strong(st) ? `<polygon class="rm-t" points="20,46 24,50 20,54 16,50"/>` : ''}</svg>`;
}

    <div class="wkstats"><div class="stat"><b>${cleared}</b><span>targets cleared</span></div><div class="stat"><b>${strongN}/7</b><span>strong days</span></div><div class="stat"><b>${xp}</b><span>XP earned</span></div></div>

/* ---------- handover.txt ---------- */
function didText(k) {
  const rec = day(k);
  const items = rec.log.filter(e => e.kind !== 'handover').slice().sort((a, b) => a.t - b.t);
  if (!items.length) return '';
  return items.map(e => `✓ ${e.label}`).join('\n');
}
function missedItems(k) {
  const rec = day(k), out = [], seen = new Set();
  const add = label => { if (!seen.has(label)) { seen.add(label); out.push(label); } };
  if (rec.highlight && rec.highlight.text && !rec.highlight.done) add(`Highlight: ${rec.highlight.text}`);
  scheduled(rec).filter(h => !rec.habits[h.id]).forEach(h => add(h.name));
  rec.planned.map(taskById).filter(t => t && !t.done).forEach(t => add(t.title));
  S.tasks.filter(isArrest).forEach(t => add(`${t.title} (PERI-ARREST)`));
  return out;
}

function vHandover() {

      ? [['S', 'Situation', ho.s], ['B', 'Background', ho.b], ['A', 'Assessment', ho.a], ['R', 'Recommendation', ho.r]].map(([L, n, v]) => QA(L, n, `<div class="sbar-read">${esc(v) || '<span class="mute">—</span>'}</div>`)).join('')

/* =========================================================
   Laser focus mode
   ========================================================= */
let LZ = null, lzTimer = 0, wakeLock = null;
const lzElapsed = () => LZ.focused + (LZ.running ? Date.now() - LZ.since : 0);
function laserStart(min, label, ref) {
  LZ = { id: uid(), label, ref: ref || null, planned: min * 60000, focused: 0, since: Date.now(), running: true, cracks: [], leftAt: 0, start: Date.now() };
  S.activeLaser = LZ; save(); closeModal(); showLaser();
  $('#lzMsg').textContent = 'Time is moving. Stay.';
}
function showLaser() {
  $('#laser').hidden = false; drawCracks();
  clearInterval(lzTimer); lzTimer = setInterval(lzTick, 250); lzTick();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
}
function lzTick() {
  if (!LZ) return;
  const el = lzElapsed(), rem = Math.max(0, LZ.planned - el);
  $('#lzLabel').textContent = LZ.label;
  $('#lzClock').textContent = `${pad(Math.floor(rem / 60000))}:${pad(Math.floor(rem / 1000) % 60)}`;
  $('#lzProg').style.width = (el / LZ.planned * 100).toFixed(2) + '%';
  $('#lzCracks').innerHTML = LZ.cracks.length ? `${crackGlyph(LZ.cracks.length)} ON THIS SESSION'S RECORD` : 'NO CRACKS · CLEAN GLASS';
  if (LZ.running && Date.now() - (LZ.lastSave || 0) > 5000) { LZ.lastSave = Date.now(); LZ.lastTick = Date.now(); S.activeLaser = LZ; saveNow(); }
  if (rem <= 0) laserEnd(true);
}
function laserAway() {
  if (!LZ || !LZ.running) return;
  LZ.focused += Date.now() - LZ.since; LZ.running = false; LZ.leftAt = Date.now();
  S.activeLaser = LZ; saveNow();
}
function laserBack() {
  if (!LZ || LZ.running) return;
  const away = Date.now() - (LZ.leftAt || Date.now());
  LZ.cracks.push({ x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.7, s: Math.floor(Math.random() * 1e9), away });
  LZ.running = true; LZ.since = Date.now();
  S.activeLaser = LZ; save();
  drawCracks(); sfxCrack(); vibrate([30, 40, 30]);
  $('#lzMsg').textContent = `Time stopped while you were away (${dur(away) === '0m' ? '<1m' : dur(away)}). Crack recorded.`;
}
function crackPath(c, w, h) {
  const R = rng(c.s), cx = c.x * w, cy = c.y * h, arms = 7 + Math.floor(R() * 4), maxR = Math.max(w, h) * (0.35 + R() * 0.3);
  let d = '', rings = '';
  const ends = [];
  for (let i = 0; i < arms; i++) {
    const a = (i / arms) * Math.PI * 2 + R() * 0.5;
    let x = cx, y = cy, r = 0; d += `M${cx.toFixed(1)} ${cy.toFixed(1)}`;
    const pts = [];
    while (r < maxR * (0.5 + R() * 0.5)) { r += 18 + R() * 40; const aa = a + (R() - 0.5) * 0.35; x = cx + Math.cos(aa) * r; y = cy + Math.sin(aa) * r; d += `L${x.toFixed(1)} ${y.toFixed(1)}`; pts.push([x, y, r]); }
    ends.push(pts);
  }
  for (let ring = 1; ring <= 3; ring++) {
    const rr = ring * (28 + R() * 30);
    ends.forEach((pts, i) => {
      const nx = ends[(i + 1) % ends.length];
      const p = pts.find(q => q[2] >= rr), q = nx.find(z => z[2] >= rr);
      if (p && q && R() > 0.25) rings += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`;
    });
  }
  const hole = [...Array(6)].map((_, i) => { const a = i / 6 * Math.PI * 2, r = 5 + R() * 6; return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`; }).join(' ');
  return `<path d="${d}"/><path class="ring" d="${rings}"/><polygon class="hole" points="${hole}"/>`;
}
function drawCracks() {
  const svg = $('#cracks'), w = innerWidth, h = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = LZ ? LZ.cracks.map(c => crackPath(c, w, h)).join('') : '';
}
function laserEnd(completed) {
  if (!LZ) return;
  clearInterval(lzTimer);
  const el = lzElapsed(), mins = Math.round(el / 60000);
  const ok = completed && mins >= 1;
  const sess = { id: LZ.id, date: todayKey(), label: LZ.label, ref: LZ.ref, planned: LZ.planned, focused: el, cracks: LZ.cracks.length, crackData: LZ.cracks, completed: ok, end: Date.now() };
  S.sessions.push(sess);
  if (S.sessions.length > 500) S.sessions = S.sessions.slice(-500);
  const rect = $('#lzClock').getBoundingClientRect();
  const cracks = LZ.cracks.length;
  LZ = null; S.activeLaser = null;
  $('#laser').hidden = true; $('#cracks').innerHTML = '';
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  if (ok) {
    const xp = Math.max(1, Math.round(mins * (cracks ? 0.5 : 1)));
    award('laser', sess.id, `LASER ${mins} min · ${sess.label}${cracks ? ` · ${cracks} crack${cracks > 1 ? 's' : ''}` : ''}`, xp, rect, cracks ? `LASER COMPLETE · +${xp} XP · CRACKS HALVE THE XP` : `LASER COMPLETE · CLEAN GLASS · +${xp} XP`, BG.col.ink);
  } else { save(); toast(completed ? 'Under a minute. Not logged.' : 'Session aborted. Logged with no XP.'); }
  render();
}

/* =========================================================
   Replay & chant
   ========================================================= */
let RP = null;
const GLYPH = { habit: '◆', task: '✚', highlight: '★', laser: '◎', urge: '⊘', handover: '≡' };
function replay(k, chantAfter) {
  closeModal();
  const rec = S.days[k], items = ((rec && rec.log) || []).slice().sort((a, b) => a.t - b.t);
  $('#replay').hidden = false;
  $('#rpTitle').textContent = `REPLAY · ${dateLong(k)}`;
  const list = $('#rpList'); list.innerHTML = '';
  let i = 0, tot = 0;
  const step = Math.max(55, Math.min(150, 2200 / Math.max(1, items.length)));
  $('#rpFF').textContent = `▶▶ ×${Math.round(150 / step * 16)}`;
  const add = e => { tot += e.xp; list.insertAdjacentHTML('beforeend', `<div class="ri"><span class="mute">${hhmm(e.t)}</span><span class="g">${GLYPH[e.kind] || '·'}</span><span>${esc(e.label)}</span><span class="x">+${e.xp}</span></div>`); list.scrollTop = list.scrollHeight; $('#rpTot').textContent = `+${tot} XP`; };
  const finish = () => {
    clearInterval(RP.iv);
    while (i < items.length) add(items[i++]);
    if (!items.length) list.innerHTML = `<div class="empty">Nothing cleared. Zero is the only real failure: tomorrow, do the minimum.</div>`;
    RP.done = true; $('#rpBtn').textContent = chantAfter ? 'CONTINUE' : 'CLOSE';
    if (chantAfter) RP.auto = setTimeout(() => { if (RP && RP.done) rpClose(); }, 900);
  };
  RP = { iv: 0, done: false, finish, chantAfter, k, auto: 0 };
  $('#rpBtn').textContent = 'SKIP';
  $('#rpTot').textContent = '+0 XP';
  if (rm() || !items.length) { finish(); return; }
  RP.iv = setInterval(() => { if (i < items.length) { add(items[i++]); if (i % 3 === 0) snap(); } else finish(); }, step);
}
function rpClose() {
  if (!RP) return;
  clearTimeout(RP.auto); const after = RP.chantAfter, k = RP.k; RP = null;
  $('#replay').hidden = true;
  if (after) chant(k);
}
function chant(k) {
  const list = S.settings.chants.filter(Boolean);
  const st = dayStats(k);
  let phrase = list.length ? list[Math.floor(Math.random() * list.length)] : 'NOT. AVERAGE.';
  if (!st.cleared) phrase = 'TOMORROW. MINIMUM.';
  const beats = phrase.split('.').map(s => s.trim()).filter(Boolean);
  const el = $('#chant');
  el.innerHTML = beats.map(b => `<div class="w">${esc(b)}.</div>`).join('');
  el.hidden = false; el.classList.remove('inv');
  const ws = el.querySelectorAll('.w');
  let closed = false;
  const close = () => { if (closed) return; closed = true; el.hidden = true; el.removeEventListener('click', close); render(); };
  el.addEventListener('click', close);
  if (rm()) { ws.forEach(w => w.classList.add('in')); setTimeout(close, 1800); return; }
  ws.forEach((w, i) => setTimeout(() => { w.classList.add('in'); sfxBeat(i === ws.length - 1); snap(); vibrate(25); if (i === ws.length - 1) el.classList.add('inv'); }, 80 + i * 420));
  setTimeout(close, 80 + ws.length * 420 + 1000);
}

const rectOf = sel => { const e = typeof sel === 'string' ? $(sel) : sel; return e ? e.getBoundingClientRect() : null; };
const lvColor = t => { const cs = getComputedStyle(document.documentElement); const v = isArrest(t) ? '--lv-arrest' : '--lv-' + (t.level || 'routine'); return cs.getPropertyValue(v).trim() || BG.col.red; };

function addTask(title, deadline, cat) {
  title = String(title || '').trim(); if (!title) return;
  const now = Date.now();
  S.tasks.push({ id: uid(), title, level: null, deadline: deadline || null, created: now, touched: now, done: null, doneKey: null, escalated: false, notes: '', cat: cat || 'admin' });

}
function setLevel(id, lv) {

  t.level = lv; t.touched = Date.now(); if (lv !== 'semi') t.escalated = false;
  save(); bgThreats(); snap();
  if (was !== lv) toast(`Triaged: ${LV_NAME[lv]}${lv === 'urgent' && !t.deadline ? '. Add a deadline to track it.' : ''}`);
}
function discharge(id, rect) {
  const t = taskById(id); if (!t || t.done) return;
  const lv = t.level || 'routine', color = lvColor(t);
  t.done = Date.now(); t.doneKey = todayKey(); bgThreats();

    `<span class="dim">DISCIPLINE KERNEL 1.0 · ${dateLong(todayKey())} · ${hhmm(Date.now())}</span>`,

    `<span class="ok">[ OK ]</span> dopamine filter … ACTIVE`,

  wShards(p, [W.C.red, W.C.red, W.C.wall], 26);
  it.g.remove(it.gem); it.gem.geometry.dispose(); it.gem.material.dispose();
  it.gem = wTargetGem(true); it.gem.position.y = 1.5; if (it.big) it.gem.scale.setScalar(1.6); it.g.add(it.gem);
  it.g.remove(it.lab); it.lab.material.map.dispose(); it.lab.material.dispose();
  const rec = day();
  const label = it.kind === 'hl' ? ['Highlight', 'WIN SECURED'] : wHabitLabel(habitById(it.id), rec);
  it.lab = wLabel(label, { bar: W.C.ink }); it.lab.position.set(0, it.big ? 2.45 : 2.2, 0); it.g.add(it.lab);
  it.cleared = true;
}
function wRetriage(it) {
  const t = taskById(it.id); if (!t) return;
  const pos = it.g.position.clone();
  it.dead = true; W.scene.remove(it.g);
  wShards(new W.T.Vector3(pos.x, 1.1, pos.z), [W.C.mute, W.C.wall], 14);
  wAddTask(t, pos.x, pos.z, it.bounds);
}
function wHud() {
  const l = lvl(S.xp);
  $('#wXp').innerHTML = `LV ${l.L} · ${esc(rankOf(l.L))}<br>${S.xp} XP`;
}
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
function wLoop(t) {
  if (!W.on) return;
  const dt = W.last ? Math.min(0.05, (t - W.last) / 1000) : 0.016; W.last = t;
  // movement
  const k = W.keys;
  let mx = ((k.d || k.arrowright) ? 1 : 0) - ((k.a || k.arrowleft) ? 1 : 0) + W.joy.x;
  let mz = ((k.w || k.arrowup) ? 1 : 0) - ((k.s || k.arrowdown) ? 1 : 0) - W.joy.y;
  const len = Math.hypot(mx, mz); if (len > 1) { mx /= len; mz /= len; }
  const sp = 3.4 * dt, sy = Math.sin(W.yaw), cy = Math.cos(W.yaw);
  const dx = (mx * cy - mz * sy) * sp, dz = (-mx * sy - mz * cy) * sp;
  if (dx || dz) {
    const ok = (x, z) => wInside(x, z) && !W.items.some(it => !it.dead && Math.hypot(it.g.position.x - x, it.g.position.z - z) < (it.kind === 'task' ? 0.6 : 0.75));
    if (ok(W.px + dx, W.pz + dz)) { W.px += dx; W.pz += dz; }
    else if (ok(W.px + dx, W.pz)) W.px += dx;
    else if (ok(W.px, W.pz + dz)) W.pz += dz;
  }
  // time only moves when you move
  const moving = len > 0.05;
  const target = moving ? 1 : (W.lookMoved ? 0.3 : 0.03);
  W.lookMoved = false;
  W.ts += (target - W.ts) * Math.min(1, dt * (target > W.ts ? 10 : 3));
  const sdt = dt * W.ts; W.sim += sdt;
  if (moving) W.walk += dt * Math.min(1, len);
  for (const it of W.items) {
    if (it.dead) continue;
    if (it.kind === 'task') {
      const g = it.g, ddx = W.px - g.position.x, ddz = W.pz - g.position.z, d = Math.hypot(ddx, ddz);
      if (it.level === 'semi' || it.level === 'urgent') g.rotation.y += angDiff(Math.atan2(ddx, ddz), g.rotation.y) * Math.min(1, sdt * (it.level === 'urgent' ? 3 : 1.2));
      if (it.level === 'urgent') {
        const b = it.bounds;
        if (d > 1.8 && d < 11 && W.px > b.x1 && W.px < b.x2 && W.pz > b.z1 && W.pz < b.z2) {
          const st = Math.min(d - 1.8, sdt * 0.7);
          g.position.x = clamp(g.position.x + ddx / d * st, b.x1 + 0.6, b.x2 - 0.6);
          g.position.z = clamp(g.position.z + ddz / d * st, b.z1 + 0.6, b.z2 - 0.6);
        }
        g.scale.setScalar(1 + Math.sin(W.sim * 5 + it.ph) * 0.05);
      }
    } else if (it.gem) {
      it.gem.rotation.y += sdt * (it.cleared ? 0.4 : 1.6);
      it.gem.position.y = 1.5 + Math.sin(W.sim * 1.6 + it.ph) * 0.07;
    }
  }
  for (const m of W.deco) { m.rotation.x += m.userData.v[0] * sdt; m.rotation.y += m.userData.v[1] * sdt; }
  const pdt = dt * Math.max(0.35, W.ts);
  W.parts = W.parts.filter(m => {
    const u = m.userData; u.age += pdt;
    if (u.age > u.life) { W.scene.remove(m); m.geometry.dispose(); m.material.dispose(); return false; }
    u.v.y -= 9 * pdt; m.position.addScaledVector(u.v, pdt);
    if (m.position.y < 0.05) { m.position.y = 0.05; u.v.y *= -0.3; u.v.x *= 0.7; u.v.z *= 0.7; }
    m.rotation.x += u.s.x * pdt; m.rotation.y += u.s.y * pdt;
    m.material.opacity = 1 - Math.max(0, (u.age - u.life * 0.6) / (u.life * 0.4));
    return true;
  });
  const bob = moving && !rm() ? Math.sin(W.walk * 9) * 0.035 : 0;
  W.cam.position.set(W.px, EYE + bob, W.pz);
  W.cam.rotation.set(W.pitch, W.yaw, 0);
  // which room am I in?
  const room = W.rooms.slice().reverse().find(r => W.px >= r.rect.x1 && W.px <= r.rect.x2 && W.pz >= r.rect.z1 && W.pz <= r.rect.z2);
  const nm = room ? room.name : 'Corridor';
  if (nm !== W.room) { W.room = nm; $('#wRoom').innerHTML = `${esc(nm)}<small>${esc(room ? room.sub : '')}</small>`; }
  // what am I looking at?
  if (t - W.hoverT > 120) {
    W.hoverT = t;
    const p = wPick(0, 0), ok = p && p.d < 7;
    $('#wXh').classList.toggle('on', !!ok);
    let hint = '';
    if (ok) {
      const it = p.it;
      if (it.kind === 'task') { const tk = taskById(it.id); hint = tk ? `${tk.level ? 'DISCHARGE' : 'TRIAGE'}: ${tk.title}` : ''; }
      else if (it.kind === 'habit') { const h = habitById(it.id); hint = h ? `${it.cleared ? 'CLEARED' : 'TARGET'}: ${h.name}` : ''; }
      else hint = it.cleared ? 'HIGHLIGHT: WIN SECURED' : 'HIGHLIGHT';
    }
    $('#wHint').textContent = hint;
  }
  W.r.render(W.scene, W.cam);
  W.raf = requestAnimationFrame(wLoop);
}
// world input
(() => {
  const cv = $('#wcv');
  cv.addEventListener('pointerdown', e => {
    if (!W.on) return;
    W.look = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    ac();
  });
  cv.addEventListener('pointermove', e => {
    const L = W.look; if (!L || L.id !== e.pointerId) return;
    const dx = e.clientX - L.x, dy = e.clientY - L.y; L.x = e.clientX; L.y = e.clientY;
    W.yaw -= dx * 0.0055; W.pitch = clamp(W.pitch - dy * 0.0045, -1.2, 1.2);
    if (dx || dy) W.lookMoved = true;
  });
  const up = e => {
    const L = W.look; if (!L || L.id !== e.pointerId) return; W.look = null;
    if (e.type === 'pointerup' && Math.hypot(e.clientX - L.sx, e.clientY - L.sy) < 8 && performance.now() - L.t < 450) wTap(e.clientX, e.clientY);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  const joy = $('#wJoy'), knob = $('#wKnob');
  const setJoy = e => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let x = (e.clientX - cx) / 46, y = (e.clientY - cy) / 46; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    W.joy.x = x; W.joy.y = y; knob.style.transform = `translate(${x * 38}px, ${y * 38}px)`;
  };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); W.joy.id = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (_) {} setJoy(e); ac(); });
  joy.addEventListener('pointermove', e => { if (W.joy.id === e.pointerId) setJoy(e); });
  const jEnd = e => { if (W.joy.id !== e.pointerId) return; W.joy.id = null; W.joy.x = W.joy.y = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', jEnd); joy.addEventListener('pointercancel', jEnd);
  document.addEventListener('keydown', e => {
    const key = (e.key || '').toLowerCase();
    if (!W.on) { if (key === 'escape' && !$('#world').hidden) worldClose(); return; }
    if (key === 'escape') { if (W.panelItem) wPanelClose(); else worldClose(); return; }
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName)) return;
    if (W.panelItem) return;
    if (key === 'e' || key === ' ' || key === 'enter') { e.preventDefault(); const p = wPick(0, 0); if (p) wInteract(p.it, p.d); return; }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) { e.preventDefault(); W.keys[key] = true; }
  });
  document.addEventListener('keyup', e => { W.keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { W.keys = {}; });
  window.addEventListener('resize', wResize);
})();

function init() {
  S = load();
  BG.c = $('#bg'); BG.x = BG.c.getContext('2d');
  FX.c = $('#fx'); FX.x = FX.c.getContext('2d');
  const h = (location.hash || '').slice(1);
  if (VIEWS[h]) view = h;
  curKey = todayKey(); day(curKey);

  applySettings(); bgResize(); fxResize(); bgThreats();

  boot();

  saveNow();
}
init();
})();
