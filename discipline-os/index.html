<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Discipline OS: habits, routines, goals, tasks and focus, built on Atomic Habits and Make Time. Better than yesterday.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single working column (max 760px) under a sticky status bar; bottom tab bar on phones, left rail from 960px. Motif: the dashed "your average" line every score has to clear. Dawn amber marks the morning, dusk indigo the evening. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E4E9EE; --ink:#111922; --ink-2:#46525E; --ink-3:#6C7985; --line:#D3DAE0;
  --dawn:#D88A0B; --dawn-ink:#8A5300; --dawn-soft:#FBEACB; --on-dawn:#1C1200;
  --dusk:#4450C4; --dusk-ink:#3440B0; --dusk-soft:#E1E4F8;
  --good:#1E8758; --good-soft:#D8F0E4; --bad:#C2412E; --bad-soft:#F7DED8;
  --u-routine:#7A8792; --u-semi:#D88A0B; --u-urgent:#C2412E;
  --shadow:0 1px 2px rgba(17,25,34,.06),0 10px 30px -18px rgba(17,25,34,.28);
  --scrim:rgba(10,14,18,.48);
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Instrument Sans','Helvetica Neue','Segoe UI',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1015; --surface:#131A21; --surface-2:#1C252E; --ink:#E5EBF0; --ink-2:#A6B2BD; --ink-3:#7A8793; --line:#25313B;
    --dawn:#F2B13F; --dawn-ink:#F2B13F; --dawn-soft:#33260F; --on-dawn:#1C1200;
    --dusk:#939CF6; --dusk-ink:#A9B0FA; --dusk-soft:#20244A;
    --good:#4CC48A; --good-soft:#11301F; --bad:#F27D69; --bad-soft:#3A1B16;
    --u-routine:#8593A0; --u-semi:#F2B13F; --u-urgent:#F27D69;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1015; --surface:#131A21; --surface-2:#1C252E; --ink:#E5EBF0; --ink-2:#A6B2BD; --ink-3:#7A8793; --line:#25313B;
  --dawn:#F2B13F; --dawn-ink:#F2B13F; --dawn-soft:#33260F; --on-dawn:#1C1200;
  --dusk:#939CF6; --dusk-ink:#A9B0FA; --dusk-soft:#20244A;
  --good:#4CC48A; --good-soft:#11301F; --bad:#F27D69; --bad-soft:#3A1B16;
  --u-routine:#8593A0; --u-semi:#F2B13F; --u-urgent:#F27D69;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.1}
p{margin:0}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.3 var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font:800 17px/1 var(--font-d);letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.brand small{font:500 10px/1 var(--font-m);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;display:block;margin-top:3px}
.hud{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.lvchip{display:flex;align-items:center;gap:8px;min-width:0;padding:5px 10px 5px 6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.lvchip .lv{font:700 12px/1 var(--font-m);background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 7px;white-space:nowrap}
.lvchip .meta{display:grid;gap:3px;min-width:0}
.lvchip .rk{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.lvchip .bar{width:84px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lvchip .bar i{display:block;height:100%;background:var(--dawn);transition:width .4s}
.lvchip .xp{font:500 11px/1 var(--font-m);color:var(--ink-3);white-space:nowrap}
.lvchip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.06)}}
.streak{display:flex;align-items:center;gap:5px;font:700 13px/1 var(--font-m);padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.streak svg{width:14px;height:14px;color:var(--dawn)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
@media (max-width:520px){.lvchip .meta .rk,.lvchip .xp{display:none}.lvchip .bar{width:56px}.brand small{display:none}}

.shell{max-width:1100px;margin:0 auto;display:block}
.rail{display:none}
main{max-width:760px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
.tab{display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--dawn)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail{display:grid;align-content:start;gap:2px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));padding-top:18px;height:max-content}
  .rail .tab{grid-template-columns:22px 1fr;justify-items:start;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px}
  .rail .tab:hover{background:var(--surface)}
  .rail .tab.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .rail hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
  .tabbar{display:none}
  main{margin:0;padding-left:0;padding-right:0;padding-bottom:60px}
}

/* ---------- cards & controls ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);padding:16px;display:grid;gap:14px;min-width:0}
.card.flat{box-shadow:inset 0 0 0 1px var(--line)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch h2{font-size:19px;font-weight:700}
.ch .eyebrow{margin-bottom:4px}
.ch .side{font:500 12px/1.3 var(--font-m);color:var(--ink-3);text-align:right;white-space:nowrap}
.sun,.moon{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none}
.sun{background:var(--dawn-soft);color:var(--dawn-ink)}
.moon{background:var(--dusk-soft);color:var(--dusk-ink)}
.sun svg,.moon svg{width:16px;height:16px}
.titlerow{display:flex;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.dawn{background:var(--dawn);color:var(--on-dawn)}
.btn.dusk{background:var(--dusk);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:500;line-height:1.25;max-width:100%;text-align:left}
.chip.on,.chip:has(input:checked){background:var(--ink);color:var(--bg)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip small{color:inherit;opacity:.7;font-size:11px}
label.chip{cursor:pointer;position:relative}
label.chip:has(input:focus-visible){outline:2px solid var(--dawn);outline-offset:2px}

.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=time],input[type=date],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.35}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dawn);box-shadow:0 0 0 3px var(--dawn-soft)}
input[type=number]{font-family:var(--font-m)}
.inline{display:flex;gap:8px;min-width:0}
.inline>input{flex:1}

.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--dawn);transition:width .35s}
.bar.good i{background:var(--good)}
.bar.dusk i{background:var(--dusk)}
.empty{padding:14px;border-radius:10px;background:var(--bg);color:var(--ink-3);font-size:13px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--font-m);letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.dawn{background:var(--dawn-soft);color:var(--dawn-ink)}
.pill.dusk{background:var(--dusk-soft);color:var(--dusk-ink)}
.ex{font:500 10px/1 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--line);border-radius:5px;padding:2px 5px;vertical-align:1px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";font-family:var(--font-m)}
details[open]>summary::before{content:"− "}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.hero-id{display:grid;align-content:space-between;gap:14px;padding:4px 2px}
.hero-id h1{font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.02}
.hero-id .qm{color:var(--dawn-ink)}
.hero-id p{color:var(--ink-2);font-size:14px;max-width:44ch}
.score{display:grid;gap:8px}
.score .nums{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.score .big{font:800 52px/0.9 var(--font-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .big small{font:500 13px/1 var(--font-m);color:var(--ink-3);letter-spacing:0;margin-left:3px}
.delta{font:600 12px/1.25 var(--font-m);padding:6px 8px;border-radius:8px;text-align:right}
.delta.up{background:var(--good-soft);color:var(--good)}
.delta.down{background:var(--dawn-soft);color:var(--dawn-ink)}
.delta.flat{background:var(--surface-2);color:var(--ink-2)}
svg.spark{width:100%;height:auto;display:block;overflow:visible}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--dawn-soft);stroke:none}
.spark .avgl,.chart .avgl{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.spark .avgt,.chart .avgt{fill:var(--ink-3);font:500 9.5px var(--font-m)}
.spark .endp{fill:var(--dawn);stroke:var(--surface);stroke-width:2}
.spark .dot{fill:var(--ink)}

/* ---------- highlight ---------- */
.hl{position:relative;overflow:hidden}
.hl .star{color:var(--dawn)}
.hl-text{font:700 clamp(22px,4.8vw,30px)/1.12 var(--font-d);letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.hl.done .hl-text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--dawn)}
.hl-done{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:600;font-size:14px}

/* ---------- habit rows ---------- */
.hlist{display:grid;gap:2px}
.hrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-radius:10px}
.hrow+.hrow{border-top:1px solid var(--line);border-radius:0}
.ring{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}
.ring svg{width:16px;height:16px}
.hrow.full .ring{background:var(--good);box-shadow:none;color:#fff}
.hrow.min .ring{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good);color:var(--good)}
.hrow.risk .ring{box-shadow:inset 0 0 0 2px var(--dawn)}
.hn{font-weight:600;line-height:1.3}
.hcue{font-size:13px;color:var(--ink-2);line-height:1.35}
.hcue b{font-weight:600;color:var(--ink)}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font:500 11.5px/1.3 var(--font-m);color:var(--ink-3)}
.hmeta .warn{color:var(--dawn-ink)}
.hmeta .bro{color:var(--bad)}
.hmeta .st{color:var(--ink)}
.hacts{display:flex;gap:6px;align-items:center}
.hacts .btn{min-height:34px;padding:5px 10px;font-size:13px}
.hacts .done-l{font:600 12px/1.2 var(--font-m);color:var(--good);text-align:right}
.hrow.full .hn,.hrow.min .hn{color:var(--ink-2)}
@media (max-width:460px){.hrow{grid-template-columns:28px minmax(0,1fr)}.hrow .hacts{grid-column:2}}
.energy{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.en{display:grid;justify-items:center;gap:3px;padding:8px 4px;border-radius:10px;background:var(--bg);font-size:12px;font-weight:600;color:var(--ink-3)}
.en svg{width:18px;height:18px}
.en.on{background:var(--good-soft);color:var(--good)}
.rate{display:flex;gap:4px}
.rate button,.rate label{width:34px;height:34px;border-radius:9px;background:var(--surface-2);font:700 13px/34px var(--font-m);text-align:center;cursor:pointer;position:relative}
.rate .on,.rate label:has(input:checked){background:var(--ink);color:var(--bg)}
.rate input{position:absolute;opacity:0;pointer-events:none}

/* habit cards (habits view) */
.hcard{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.hcard .hrow{padding:0;border:0}
.vers{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
.vers dt{font:600 11px/1.6 var(--font-m);color:var(--ink-3);letter-spacing:.05em}
.vers dd{margin:0;min-width:0}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.dots i{height:10px;border-radius:3px;background:var(--surface-2)}
.dots i.full{background:var(--good)}
.dots i.min{background:var(--good);opacity:.45}
.dots i.miss{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.dots i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.dots i.pend{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dawn)}
.dots i.pre{background:transparent}
.laws{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin:8px 0 0}
.laws dt{font:600 11px/1.6 var(--font-m);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.laws dd{margin:0}
.votes{display:grid;gap:8px}
.vote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.vote b{font:700 15px/1 var(--font-m)}
.vote .bar{grid-column:1/-1}

/* ---------- bad habits ---------- */
.badrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.badrow+.badrow{border-top:1px solid var(--line)}
.badrow .bn{font-weight:600}
.urgebtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg);text-align:left}
.urgebtn svg{width:26px;height:26px;flex:none;color:var(--dawn)}
.urgebtn b{display:block;font:700 17px/1.2 var(--font-d)}
.urgebtn span{font-size:13px;opacity:.75}
.strip{display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
.strip i{height:16px;border-radius:2px;background:var(--surface-2)}
.strip i.l1{background:color-mix(in srgb,var(--bad) 35%,var(--surface-2))}
.strip i.l2{background:color-mix(in srgb,var(--bad) 65%,var(--surface-2))}
.strip i.l3{background:var(--bad)}
.strip i.pre{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.bstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.bstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bstat{padding:10px;border-radius:10px;background:var(--surface)}
.bstat b{display:block;font:700 20px/1.1 var(--font-m);font-variant-numeric:tabular-nums}
.bstat span{font-size:11.5px;color:var(--ink-3);line-height:1.25;display:block;margin-top:2px}
.bstat .tr{font:600 11px/1 var(--font-m)}
.tr.good{color:var(--good)} .tr.bad{color:var(--bad)}
.cost{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:500}

/* ---------- plan / blocks / tasks ---------- */
.ledger{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px/1.3 var(--font-m);color:var(--ink-3)}
.ledger b{color:var(--ink);font-weight:700}
.blocks{display:grid;gap:0}
.blk{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .tm{font:600 12.5px/1.3 var(--font-m);font-variant-numeric:tabular-nums}
.blk .tm small{display:block;color:var(--ink-3);font-weight:500}
.blk.now{background:linear-gradient(90deg,var(--dawn-soft),transparent);border-radius:8px;padding-inline:6px;margin-inline:-6px}
.blk.past .bl{color:var(--ink-3)}
.blk.done .bl{text-decoration:line-through;color:var(--ink-3)}
.nowline{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--font-m);color:var(--dawn-ink);padding:4px 0}
.nowline::after{content:"";flex:1;border-top:1.5px solid var(--dawn)}

.tcard{display:grid;grid-template-columns:22px 26px minmax(0,1fr);grid-template-areas:"g k b" "g k a";gap:4px 8px;align-items:center;padding:10px 10px 10px 6px;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),inset 3px 0 0 var(--uc,var(--u-routine));position:relative;touch-action:pan-y}
.tcard.u-routine{--uc:var(--u-routine)} .tcard.u-semi{--uc:var(--u-semi)} .tcard.u-urgent{--uc:var(--u-urgent)}
.tcard .grip{grid-area:g;align-self:stretch;display:grid;place-items:center;color:var(--ink-3);cursor:grab;touch-action:none;border-radius:6px}
.tcard .grip svg{width:14px;height:18px}
.tcard .tick{grid-area:k;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}
.tcard .tick svg{width:14px;height:14px}
.tcard.done .tick{background:var(--good);box-shadow:none;color:#fff}
.tcard .tb{grid-area:b;text-align:left;min-width:0;display:grid;gap:2px}
.tcard .tt{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tcard.done .tt{text-decoration:line-through;color:var(--ink-3)}
.tcard .tm{font:500 11.5px/1.3 var(--font-m);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 8px}
.tcard .tm .od{color:var(--bad);font-weight:700}
.tcard .ta{grid-area:a;display:flex;flex-wrap:wrap;gap:6px}
.upill{font:600 11px/1 var(--font-m);padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--uc) 16%,transparent);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--uc) 55%,transparent);letter-spacing:.02em}
.todaybtn{font:600 11px/1 var(--font-m);padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.todaybtn.on{background:var(--dawn-soft);color:var(--dawn-ink);box-shadow:inset 0 0 0 1px var(--dawn)}
.tcard.lifted{opacity:.35;outline:2px dashed var(--ink-3);outline-offset:-2px}
.tcard.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:0 18px 40px -12px rgba(0,0,0,.45),inset 0 0 0 1px var(--line),inset 3px 0 0 var(--uc);transform:rotate(1.2deg);margin:0}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:720px){.board{grid-template-columns:1fr}}
.col{display:grid;gap:8px;padding:10px;border-radius:var(--r);background:var(--surface-2);min-width:0;transition:box-shadow .12s}
.col.over{box-shadow:inset 0 0 0 2px var(--uc)}
.col.u-routine{--uc:var(--u-routine)} .col.u-semi{--uc:var(--u-semi)} .col.u-urgent{--uc:var(--u-urgent)}
.colh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.colh h3{font-size:15px;display:flex;align-items:center;gap:8px}
.colh h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--uc)}
.colh span{font:600 12px/1 var(--font-m);color:var(--ink-3)}
.clist{display:grid;gap:8px;min-height:44px;align-content:start}
.clist:empty::after{content:"Drop tasks here";display:block;padding:12px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ---------- goals ---------- */
.cascade{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.cascade{grid-template-columns:repeat(5,minmax(58px,1fr));overflow-x:auto}}
.cas{display:grid;gap:5px;padding:10px 8px;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;min-width:0}
.cas.on{box-shadow:inset 0 0 0 2px var(--ink)}
.cas .eyebrow{font-size:10px;letter-spacing:.08em}
.cas b{font:700 17px/1 var(--font-m)}
.cas b small{font-size:11px;color:var(--ink-3);font-weight:500}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav h2{font-size:20px;text-align:center}
.pnav .sub{display:block;font:500 11.5px/1.3 var(--font-m);color:var(--ink-3);text-align:center;margin-top:3px}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.gk{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent;margin-top:1px}
.gk svg{width:15px;height:15px}
.goal.done .gk{background:var(--good);box-shadow:none;color:#fff}
.goal .gt{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.goal.done .gt{color:var(--ink-3);text-decoration:line-through}
.goal .gm{font:500 11.5px/1.35 var(--font-m);color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 10px}
.goal .gp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{min-width:30px;padding:0 6px;height:30px;border-radius:8px;background:var(--surface-2);font:700 15px/1 var(--font-m)}
.stepper input{width:64px;padding:5px 6px;text-align:center;font-size:13px}
.gnum{font:600 12px/1 var(--font-m);color:var(--ink-2);white-space:nowrap}
.pct{font:700 12px/1 var(--font-m);color:var(--ink-2)}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:12px;border-radius:12px;background:var(--bg);display:grid;gap:3px;align-content:start;min-width:0}
.tile b{font:700 22px/1.1 var(--font-m);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-3);line-height:1.3}
.tile .tr{font:600 11px/1.2 var(--font-m)}
svg.chart{width:100%;height:auto;display:block}
.chart .bx{fill:var(--surface-2)}
.chart .ab{fill:var(--dawn)}
.chart .bl{fill:var(--ink-3)}
.chart .bt{fill:var(--ink);font:600 10px var(--font-m)}
.chart .dl{fill:var(--ink-3);font:500 10px var(--font-m)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .tod{fill:var(--ink);font:700 10px var(--font-m)}
.gridwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.hg{border-collapse:separate;border-spacing:3px;width:100%;min-width:320px;font-size:12px;table-layout:fixed}
table.hg th.hcol{width:34%}
table.hg th{font:600 11px/1.2 var(--font-m);color:var(--ink-3);text-align:center;padding:2px}
table.hg th.hn2{text-align:left;font:600 12.5px/1.25 var(--font-b);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
table.hg td{padding:0}
.c{display:block;height:22px;border-radius:5px;background:var(--surface-2);text-align:center;font:600 10.5px/22px var(--font-m);color:var(--ink-3)}
.c.full{background:var(--good)}
.c.min{background:color-mix(in srgb,var(--good) 45%,var(--surface-2))}
.c.miss{background:var(--bad-soft)}
.c.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.c.pend{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dawn)}
.c.fut,.c.pre{background:transparent}
.c.s1{background:color-mix(in srgb,var(--bad) 30%,var(--surface-2));color:var(--ink)}
.c.s2{background:color-mix(in srgb,var(--bad) 60%,var(--surface-2));color:var(--ink)}
.c.s3{background:var(--bad);color:#fff}
.c.s0{background:var(--good-soft)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key .c{width:14px;height:14px;line-height:14px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font:600 11px/1 var(--font-m);color:var(--ink-3);text-align:center;padding-bottom:4px}
.cday{aspect-ratio:1;max-width:100%;border-radius:9px;background:var(--surface-2);display:grid;align-content:space-between;padding:5px 6px;text-align:left;min-width:0;font:600 11px/1 var(--font-m);color:var(--ink-2)}
.cday b{font:700 13px/1 var(--font-m);color:var(--ink);justify-self:end}
.cday.fut,.cday.pre{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.cday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cday{position:relative}
.cday .hd{position:absolute;left:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;align-items:center;font-size:13px}
.hbar .bar{grid-column:1/-1}
.hbar b{font:700 12px/1 var(--font-m);text-align:right}
.compound{display:grid;gap:4px;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg)}
.compound .eyebrow{color:inherit;opacity:.65}
.compound b{font:800 30px/1 var(--font-d);letter-spacing:-.02em}
.compound .mono{color:var(--dawn)}
.compound p{font-size:13px;opacity:.8}

/* ---------- reflect ---------- */
.q{display:grid;gap:8px}
.q>.ql{font:700 15px/1.3 var(--font-d)}
.past{display:grid;gap:10px}
.pastr{padding:12px;border-radius:10px;background:var(--bg);display:grid;gap:4px;font-size:13px}
.pastr .eyebrow{font-size:10.5px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;background:var(--bg);overflow:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov .lbl{font:800 clamp(22px,5.5vw,34px)/1.1 var(--font-d);max-width:22ch;text-wrap:balance;overflow-wrap:anywhere}
.lzring{position:relative;width:min(300px,72vw);aspect-ratio:1;max-width:100%}
.lzring svg{width:100%;height:100%;transform:rotate(-90deg)}
.lzring .tr{fill:none;stroke:var(--surface-2);stroke-width:6}
.lzring .pr{fill:none;stroke:var(--dawn);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.lzring .clock{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(46px,14vw,72px)/1 var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.lzmsg{font-size:14px;color:var(--ink-2);max-width:40ch;min-height:21px}
.breath{position:relative;width:min(220px,60vw);aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.breath i{position:absolute;inset:0;border-radius:50%;background:var(--dusk-soft);box-shadow:inset 0 0 0 2px var(--dusk);animation:breathe 8s ease-in-out infinite}
.breath b{position:relative;font:700 40px/1 var(--font-m);font-variant-numeric:tabular-nums}
.breath small{position:absolute;bottom:22%;font:600 11px/1 var(--font-m);letter-spacing:.1em;color:var(--dusk-ink);text-transform:uppercase}
@keyframes breathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.swap{max-width:420px;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;text-align:left}
.ov .row{justify-content:center}

#modal{position:fixed;inset:0;z-index:95;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@media (min-width:640px){#modal{align-items:center}#modal .sheet{border-radius:18px;max-height:86vh}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh h2{font-size:18px}
.sb{padding:14px 16px 0;display:grid;gap:14px}
.sb>*{min-width:0}

#onb{position:fixed;inset:0;z-index:96;background:var(--bg);overflow:auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.onb-in{max-width:560px;margin:0 auto;display:grid;gap:18px}
.onb-in h1{font-size:clamp(34px,9vw,54px);font-weight:800;line-height:.98}
.onb-in h1 em{font-style:normal;color:var(--dawn-ink)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--dawn)}
.pick{display:grid;gap:6px}
.pick label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-align:left}
.pick input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--dawn)}
.pick b{font-weight:600}
.pick small{display:block;color:var(--ink-3);font-size:12.5px}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:13.5px;font-weight:500;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.35;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
@media (min-width:960px){#toast{bottom:28px}}
#toast.in{animation:tin .18s ease-out}
@keyframes tin{from{transform:translate(-50%,8px);opacity:0}}
.floater{position:fixed;z-index:99;pointer-events:none;font:700 14px/1 var(--font-m);color:var(--dawn-ink);transform:translate(-50%,0);animation:fl .9s ease-out forwards;text-shadow:0 1px 0 var(--surface)}
@keyframes fl{to{transform:translate(-50%,-38px);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
  .breath i{transform:scale(.85)}
}
</style>
</head>

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const KEY = 'disciplineos.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return fmtKey(d); };
const daysBetween = (a, b) => Math.round((keyToDate(b) - keyToDate(a)) / 864e5);
const dow = k => keyToDate(k).getDay();
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dateShort = k => { const d = keyToDate(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const dm = k => { const d = keyToDate(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const toMin = s => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
const fromMin = m => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
const fmtMin = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const mondayOf = k => addDays(k, -((dow(k) + 6) % 7));
function isoWeek(k) {

function spark(vals, avg) {
  const w = 240, h = 70, pl = 4, pr = 44, pt = 8, pb = 6, n = vals.length;
  const x = i => pl + (w - pl - pr) * (n === 1 ? 1 : i / (n - 1));
  const y = v => pt + (h - pt - pb) * (1 - v / 100);
  let d = '', pen = false, area = '', seg = [];
  const flush = () => { if (seg.length > 1) area += `M${seg[0][0]} ${y(0)}L${seg.map(p => p.join(' ')).join('L')}L${seg[seg.length - 1][0]} ${y(0)}Z`; seg = []; };
  vals.forEach((v, i) => {
    if (v === null) { pen = false; flush(); return; }
    const px = x(i).toFixed(1), py = y(v).toFixed(1);
    d += `${pen ? 'L' : 'M'}${px} ${py}`; pen = true; seg.push([px, py]);
  });
  flush();
  const last = vals[n - 1];
  const dots = vals.map((v, i) => v === null || i === n - 1 ? '' : `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.6"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily score for the last ${n} days${avg !== null ? `, your average ${avg}` : ''}">
    ${area ? `<path class="ar" d="${area}" opacity=".7"/>` : ''}
    ${avg !== null ? `<line class="avgl" x1="${pl}" x2="${w - pr + 2}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avgt" x="${w - pr + 6}" y="${y(avg) + 3}">avg ${avg}</text>` : `<text class="avgt" x="${w - pr + 6}" y="${y(50) + 3}">day 1</text>`}
    <path class="ln" d="${d}"/>${dots}
    ${last !== null ? `<circle class="endp" cx="${x(n - 1)}" cy="${y(last)}" r="4.5"/>` : ''}
  </svg>`;
}
function barChart(keys, scores, avg) {
  const w = 340, h = 160, pl = 4, pr = 52, pt = 18, pb = 22, n = keys.length, tk = todayKey();
  const bw = (w - pl - pr) / n, y = v => pt + (h - pt - pb) * (1 - v / 100);
  let out = `<line class="base" x1="${pl}" x2="${w - pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  keys.forEach((k, i) => {
    const v = scores[i], x0 = pl + i * bw + bw * 0.16, bwi = bw * 0.68;
    out += `<rect class="bx" x="${x0.toFixed(1)}" y="${y(100)}" width="${bwi.toFixed(1)}" height="${(y(0) - y(100)).toFixed(1)}" rx="4" opacity=".55"/>`;
    if (v !== null) {
      const above = avg === null || v >= avg;
      out += `<rect class="${above ? 'ab' : 'bl'}" x="${x0.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bwi.toFixed(1)}" height="${Math.max(1, y(0) - y(v)).toFixed(1)}" rx="4"/>`;
      out += `<text class="bt" x="${(x0 + bwi / 2).toFixed(1)}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle">${v}</text>`;
    }
    out += `<text class="${k === tk ? 'tod' : 'dl'}" x="${(x0 + bwi / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${DOW[dow(k)].slice(0, 2)}</text>`;
  });
  if (avg !== null) out += `<line class="avgl" x1="${pl}" x2="${w - pr + 2}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avgt" x="${w - pr + 6}" y="${y(avg) - 2}">your</text><text class="avgt" x="${w - pr + 6}" y="${y(avg) + 9}">avg ${avg}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily scores this week${avg !== null ? ` against your 30-day average of ${avg}` : ''}">${out}</svg>`;
}

  const parts = { hero, checkin: checkinCard(rec), hl: highlightCard(rec, k), am: routineCard('am', rec, k), any: routineCard('any', rec, k), plan: planCard(rec, k), guard: guardCard(rec), pm: routineCard('pm', rec, k), reflect: reflectCta(rec, k) };

/* ---------- Progress ---------- */
function rangeData(from, to) {

  for (const k of keys) {
    if (k > tk || k < S.created) continue;

    hSched += hs.length;
    if (!r) continue;

    if (r.highlight && r.highlight.done) hl++;
    focus += focusMin(r); slips += (r.slips || []).length; lost += lostMin(r);
    xp += (r.log || []).reduce((a, e) => a + e.xp, 0);
    if (r.reflection) { refl++; if (r.reflection.energy) energy.push(+r.reflection.energy); }
    if (r.sleep !== null && r.sleep !== '' && !isNaN(+r.sleep)) sleep.push(+r.sleep);
  }
  const vals = scores.filter(v => v !== null);
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { keys, scores, avg: vals.length ? Math.round(mean(vals)) : null, hRate: hSched ? hDone / hSched : null, hl, focus, slips, lost, xp, refl, n, sleep: mean(sleep), energy: mean(energy) };
}

function progWeek() {
  const tk = todayKey(), mon = addDays(mondayOf(tk), ui.progOff * 7), sun = addDays(mon, 6);

    if (m) return `<span class="c ${m}" title="${m === 'full' ? 'Full' : '2-min'}"></span>`;
    return k === tk ? `<span class="c pend"></span>` : `<span class="c miss" title="Missed"></span>`;
  };
  const bcell = (b, k) => {
    if (k > tk) return `<span class="c fut"></span>`;
    const r = peek(k), s = r ? (r.slips || []).filter(x => x.badId === b.id) : [];
    if (k < S.created) return `<span class="c pre"></span>`;
    const a = b.unit === 'min' ? s.reduce((x, y) => x + (+y.amount || 0), 0) : s.length;
    if (!a) return `<span class="c s0" title="Clean"></span>`;
    const lv = b.unit === 'min' ? (a > 60 ? 3 : a > 20 ? 2 : 1) : (a > 2 ? 3 : a > 1 ? 2 : 1);
    return `<span class="c s${lv}" title="${amt(b, a)}">${a}</span>`;
  };
  const wins = c.keys.map(k => ({ k, r: peek(k) })).filter(x => x.r && x.r.reflection && (x.r.reflection.win || x.r.reflection.adjust));
  return `<section class="card">
      <div class="pnav"><button class="btn ghost sm" data-act="prog-nav" data-d="-1" aria-label="Previous week">‹</button><div><h2>Week ${isoWeek(mon)}</h2><span class="sub">${dm(mon)} – ${dm(sun)}${ui.progOff ? ` · <button class="link" data-act="prog-nav" data-d="0">this week</button>` : ''}</span></div><button class="btn ghost sm" data-act="prog-nav" data-d="1" ${ui.progOff >= 0 ? 'disabled' : ''} aria-label="Next week">›</button></div>
      ${barChart(c.keys, c.scores, avg30)}
      ${tilesHtml(c, p, 'week')}
    </section>
    <section class="card">
      <div class="ch"><div><div class="eyebrow">Habit grid</div><h2>Every rep this week</h2></div></div>
      <div class="gridwrap"><table class="hg"><thead><tr><th class="hcol"></th>${c.keys.map(k => `<th>${DOW[dow(k)].charAt(0)}<br>${keyToDate(k).getDate()}</th>`).join('')}</tr></thead><tbody>
        ${['am', 'pm', 'any'].map(r => S.habits.filter(h => h.routine === r).map(h => `<tr><th class="hn2" title="${esc(h.name)}">${esc(h.name)}</th>${c.keys.map(k => `<td>${cell(h, k)}</td>`).join('')}</tr>`).join('')).join('')}
        ${S.bad.length ? `<tr><th class="hn2" style="padding-top:10px;color:var(--ink-3);font:600 11px var(--font-m);letter-spacing:.08em">SLIPS</th>${c.keys.map(() => '<td></td>').join('')}</tr>` : ''}
        ${S.bad.map(b => `<tr><th class="hn2" title="${esc(b.name)}">${esc(b.name)}</th>${c.keys.map(k => `<td>${bcell(b, k)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="key"><span><span class="c full"></span>full</span><span><span class="c min"></span>2-min</span><span><span class="c miss"></span>missed</span><span><span class="c off"></span>rest day</span><span><span class="c s0"></span>clean</span><span><span class="c s2"></span>slipped (minutes or count)</span></div>
    </section>
    ${wins.length ? `<section class="card"><div class="ch"><div><div class="eyebrow">From your reflections</div><h2>What this week taught you</h2></div></div><div class="past">${wins.map(x => `<div class="pastr"><span class="eyebrow">${dateShort(x.k)}</span>${x.r.reflection.win ? `<div><b>Win:</b> ${esc(x.r.reflection.win)}</div>` : ''}${x.r.reflection.adjust ? `<div><b>Adjust:</b> ${esc(x.r.reflection.adjust)}</div>` : ''}</div>`).join('')}</div></section>` : ''}`;
}
function progMonth() {
  const tk = todayKey(), base = keyToDate(tk);
  const d0 = new Date(base.getFullYear(), base.getMonth() + ui.progOff, 1);
  const y = d0.getFullYear(), m = d0.getMonth(), nd = new Date(y, m + 1, 0).getDate();
  const from = fmtKey(d0), to = fmtKey(new Date(y, m, nd));
  const pd0 = new Date(y, m - 1, 1);
  const c = rangeData(from, to), p = rangeData(fmtKey(pd0), fmtKey(new Date(y, m, 0)));
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span class="dh">${x}</span>`).join('');
  for (let i = 0; i < (d0.getDay() + 6) % 7; i++) cells += '<span></span>';
  let strongN = 0;
  for (let d = 1; d <= nd; d++) {
    const k = fmtKey(new Date(y, m, d)), s = dayScore(k), r = peek(k);
    if (s !== null && s >= 70) strongN++;
    const cls = k > tk ? 'fut' : s === null ? 'pre' : '';
    const bg = s !== null ? `background:color-mix(in srgb,var(--dawn) ${Math.round(12 + s * 0.88)}%,var(--surface-2));` : '';
    cells += `<button class="cday ${cls} ${k === tk ? 'today' : ''}" style="${bg}" data-act="day-open" data-k="${k}" aria-label="${dateShort(k)}${s !== null ? `, score ${s}` : ''}"><span>${d}</span>${s !== null ? `<b>${s}</b>` : ''}${r && r.highlight && r.highlight.done ? '<span class="hd" title="Highlight won"></span>' : ''}</button>`;
  }
  const hbars = S.habits.map(h => {
    let s = 0, dn = 0;
    for (let k = from; k <= to && k <= tk; k = addDays(k, 1)) { if (!isScheduled(h, k)) continue; s++; const r = peek(k); if (r && r.habits[h.id]) dn++; }
    return { h, s, dn, r: s ? dn / s : null };
  }).filter(x => x.s);
  const allShow = Object.keys(S.days).filter(showedUp).length;
  const mult = Math.pow(1.01, allShow);
  return `<section class="card">
      <div class="pnav"><button class="btn ghost sm" data-act="prog-nav" data-d="-1" aria-label="Previous month">‹</button><div><h2>${MONTHS[m]} ${y}</h2><span class="sub">${strongN} strong ${strongN === 1 ? 'day' : 'days'} (70+)${ui.progOff ? ` · <button class="link" data-act="prog-nav" data-d="0">this month</button>` : ''}</span></div><button class="btn ghost sm" data-act="prog-nav" data-d="1" ${ui.progOff >= 0 ? 'disabled' : ''} aria-label="Next month">›</button></div>
      <div class="cal">${cells}</div>
      <div class="key"><span><span class="c" style="background:color-mix(in srgb,var(--dawn) 25%,var(--surface-2))"></span>low score</span><span><span class="c" style="background:var(--dawn)"></span>high score</span><span><span class="c" style="background:var(--ink);border-radius:50%;width:8px;height:8px"></span>Highlight won</span></div>
      ${tilesHtml(c, p, 'month')}
    </section>
    <section class="card">
      <div class="ch"><div><div class="eyebrow">Consistency</div><h2>Habit completion this month</h2></div></div>
      <div class="hbars">${hbars.map(x => `<div class="hbar"><span>${esc(x.h.name)}</span><b>${Math.round(x.r * 100)}%</b><div class="bar ${x.r >= 0.8 ? 'good' : ''}"><i style="width:${x.r * 100}%"></i></div></div>`).join('') || '<div class="empty">Fills in as the month goes.</div>'}</div>
    </section>
    <section class="compound">
      <span class="eyebrow">1% better, compounded</span>
      <b>${plural(allShow, 'day')} showing up</b>
      <span class="mono">1.01<sup>${allShow}</sup> = ${mult.toFixed(2)}×</span>
      <p>Get 1% better each day for a year and you end up 37.8 times better. Average people stay at 1.00.</p>
    </section>`;
}

/* ---------- Reflect ---------- */
function vReflect() {

  const past = [];
  for (let i = 1; i <= 14 && past.length < 5; i++) { const kk = addDays(k, -i), rr = peek(kk); if (rr && rr.reflection) past.push({ k: kk, r: rr.reflection }); }
  const rate = (name, v) => `<div class="rate">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="${name}" value="${n}" ${+v === n ? 'checked' : ''}>${n}</label>`).join('')}</div>`;
  return `<section class="card" style="gap:18px">
      <div class="ch"><div class="titlerow"><span class="moon">${I.moon}</span><div><div class="eyebrow">${dateShort(k)} · Make Time</div><h2>Evening reflection</h2></div></div><div class="side">score ${sc}${ys !== null ? `<br>yesterday ${ys}` : ''}</div></div>
      <div class="pastr" style="background:var(--surface-2)">
        <div><b>Highlight:</b> ${hl && hl.text ? `${esc(hl.text)} · ${hl.done ? '<span style="color:var(--good);font-weight:600">won</span>' : '<span class="muted">not done</span>'}` : '<span class="muted">none set today</span>'}</div>
        <div><b>Habits:</b> ${Object.keys(rec.habits).length} of ${S.habits.filter(h => isScheduled(h, k)).length} · <b>Focus:</b> ${fmtMin(focusMin(rec))} · <b>Slips:</b> ${(rec.slips || []).length}</div>
      </div>
      <form class="stack" data-form="reflect" style="gap:18px">
        <div class="row" style="gap:24px"><div class="q"><span class="ql">Energy today</span>${rate('energy', r.energy)}</div><div class="q"><span class="ql">Focus today</span>${rate('focus', r.focus)}</div></div>
        <label class="q"><span class="ql">What went well?</span><textarea name="win" id="rfWin" rows="2" maxlength="400" placeholder="Even a small win counts">${esc(r.win || '')}</textarea></label>
        <div class="q"><span class="ql">What got in the way?</span><div class="chips">${BLOCKERS.map(b => `<label class="chip"><input type="checkbox" name="block" value="${esc(b)}" ${(r.blocks || []).includes(b) ? 'checked' : ''}>${esc(b)}</label>`).join('')}</div></div>
        <label class="q"><span class="ql">One thing I’ll adjust tomorrow</span><input name="adjust" id="rfAdjust" maxlength="160" placeholder="e.g. Phone in the hallway before the study block" value="${esc(r.adjust || '')}"></label>
        <label class="q"><span class="ql">Tomorrow’s Highlight</span><input name="tomorrow" id="rfTomorrow" maxlength="120" placeholder="The one thing that makes tomorrow a win" value="${esc(r.tomorrow || '')}"><span class="tiny muted">It will be waiting for you in the morning.</span></label>
        <label class="q"><span class="ql">Grateful for</span><input name="grateful" id="rfGrateful" maxlength="160" value="${esc(r.grateful || '')}"></label>
        <button class="btn dusk block">${rec.reflection ? 'Update reflection' : `Close the day · +${XP.reflect} XP`}</button>
      </form>
    </section>
    ${past.length ? `<section class="card"><div class="ch"><div><div class="eyebrow">Recent</div><h2>Past reflections</h2></div></div><div class="past">${past.map(x => `<div class="pastr"><span class="eyebrow">${dateShort(x.k)}${x.r.energy ? ` · energy ${x.r.energy}/5` : ''}${x.r.focus ? ` · focus ${x.r.focus}/5` : ''}</span>${x.r.win ? `<div><b>Win:</b> ${esc(x.r.win)}</div>` : ''}${(x.r.blocks || []).length ? `<div><b>In the way:</b> ${x.r.blocks.map(esc).join(', ')}</div>` : ''}${x.r.adjust ? `<div><b>Adjust:</b> ${esc(x.r.adjust)}</div>` : ''}</div>`).join('')}</div></section>` : ''}`;
}

/* =========================================================
   Laser focus
   ========================================================= */
let lzTimer = 0, wakeLock = null;
function laserStart(min, label) {
  S.focusRun = { id: uid(), label, min: +min, start: Date.now(), pausedMs: 0, pausedAt: null, leaves: 0, key: todayKey() };
  saveNow(); closeSheet(); showLaser();
}
function lzElapsed(f) { return Date.now() - f.start - f.pausedMs - (f.pausedAt ? Date.now() - f.pausedAt : 0); }
function showLaser() {
  const f = S.focusRun; if (!f) return;
  const C = 2 * Math.PI * 46;
  $('#laser').innerHTML = `<div class="eyebrow">Laser · ${f.min} minutes · one thing</div>
    <div class="lbl">${esc(f.label)}</div>
    <div class="lzring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="46"/><circle class="pr" id="lzPr" cx="50" cy="50" r="46" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="clock" id="lzClock">--:--</div></div>
    <div class="lzmsg" id="lzMsg">Phone away. Just this.</div>
    <div class="row"><button class="btn ghost" id="lzPause" data-act="lz-pause">Pause</button><button class="btn dawn" data-act="lz-done">Finish</button><button class="btn ghost" data-act="lz-abort">Abandon</button></div>`;
  $('#laser').hidden = false; document.body.style.overflow = 'hidden';
  clearInterval(lzTimer); lzTimer = setInterval(lzTick, 250); lzTick();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
}
function lzTick() {
  const f = S.focusRun; if (!f) return;
  const total = f.min * 60000, el = lzElapsed(f), rem = Math.max(0, total - el), C = 2 * Math.PI * 46;
  $('#lzClock').textContent = `${pad(Math.floor(rem / 60000))}:${pad(Math.floor(rem / 1000) % 60)}`;
  $('#lzPr').setAttribute('stroke-dashoffset', (C * (1 - el / total)).toFixed(2));
  $('#lzPause').textContent = f.pausedAt ? 'Resume' : 'Pause';
  if (rem <= 0) laserEnd('complete');
}
function laserEnd(how) {
  const f = S.focusRun; if (!f) return;
  clearInterval(lzTimer);
  const mins = how === 'complete' ? f.min : Math.floor(lzElapsed(f) / 60000);
  S.focusRun = null;
  $('#laser').hidden = true; document.body.style.overflow = '';
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  if (how !== 'abort' && mins >= 1) {
    const rec = day(f.key || todayKey());
    rec.focus.push({ t: Date.now(), min: mins, label: f.label, leaves: f.leaves, complete: how === 'complete' });
    const xp = Math.max(1, Math.round(mins / 2)) + (how === 'complete' ? 5 : 0);
    award('focus', f.id, `Laser: ${f.label} (${mins} min)`, xp, null, how === 'complete' ? `${mins} minutes of deep focus. +${xp} XP${f.leaves ? ` · you left the screen ${plural(f.leaves, 'time')}` : ' · zero distractions'}` : `${mins} minutes logged. +${xp} XP`);
  } else { save(); if (how === 'abort') toast('Session abandoned. Nothing logged.'); }
  render();
}

let urgeTimer = 0, urgeEnd = 0, urgeBad = null;

function setHighlight(text, taskId) {

}
function completeTask(t, rect) {

    t.done = null; t.doneKey = null;
  } else {
    t.done = Date.now(); t.doneKey = todayKey();
    award('task', t.id, `Task: ${t.title}`, XP.task[t.urgency] || 10, rect, `Done. +${XP.task[t.urgency] || 10} XP`);
  }

}
function setGoalDone(g, done, rect) {
  if (done && !g.done) { g.done = true; g.doneKey = todayKey(); award('goal', g.id, `${HZ_NAME[g.horizon]} goal: ${g.title}`, XP.goal[g.horizon], rect, `${HZ_NAME[g.horizon]} goal complete. +${XP.goal[g.horizon]} XP`); }
  else if (!done && g.done) { revoke('goal', g.id, g.doneKey || todayKey()); g.done = false; g.doneKey = null; }
  save();
}

}

  const col = S.tasks.filter(x => x.urgency === t.urgency && x !== t);

  save(); toast(`Now ${URG_NAME[t.urgency]}`, 1400);
}

const ACT = {

    if (ui.confirm !== 'b-' + id) { ui.confirm = 'b-' + id; a.textContent = 'Tap again to delete'; return; }
    S.bad = S.bad.filter(b => b.id !== id); save(); closeSheet(); render();
  },
  slip: a => mSlip(a.dataset.id),

  'urge-win': a => { const id = a.dataset.id || urgeBad || (S.bad[0] || {}).id; const r = a.getBoundingClientRect(); if ($('#urge').hidden === false) urgeClose(); resistUrge(id, r); render(); },
  'urge-lose': () => { const id = urgeBad; urgeClose(); mSlip(id); },
  laser: a => laserStart(+a.dataset.min || 25, a.dataset.label || 'Deep work'),
  'laser-pick': () => mLaserPick(),
  'lz-pause': () => { const f = S.focusRun; if (!f) return; if (f.pausedAt) { f.pausedMs += Date.now() - f.pausedAt; f.pausedAt = null; $('#lzMsg').textContent = 'Back in. Just this.'; } else { f.pausedAt = Date.now(); $('#lzMsg').textContent = 'Paused. The clock waits for you.'; } saveNow(); lzTick(); },
  'lz-done': () => laserEnd('early'),
  'lz-abort': a => { if (a.dataset.sure) laserEnd('abort'); else { a.dataset.sure = '1'; a.textContent = 'Tap again to abandon'; } },
  'plan-pick': () => mPlanPick(),
  'pick-toggle': a => { const rec = day(), i = rec.planned.indexOf(a.dataset.id); if (i >= 0) rec.planned.splice(i, 1); else rec.planned.push(a.dataset.id); save(); mPlanPick(); render(); },
  'blk-new': () => mBlock(),
  'blk-done': a => { const b = day().blocks.find(x => x.id === a.dataset.id); if (b) { b.done = !b.done; save(); render(); } },
  'blk-del': a => { const rec = day(); rec.blocks = rec.blocks.filter(x => x.id !== a.dataset.id); save(); render(); },
  't-done': a => { const t = taskById(a.dataset.id); if (!t) return; completeTask(t, a.getBoundingClientRect()); render(); },
  't-open': a => { const t = taskById(a.dataset.id); if (t) mTask(t); },
  't-cycle': a => { const t = taskById(a.dataset.id); if (!t) return; cycleUrgency(t); render(); },
  't-plan': a => { const rec = day(), i = rec.planned.indexOf(a.dataset.id); if (i >= 0) rec.planned.splice(i, 1); else { rec.planned.push(a.dataset.id); toast('Added to today’s plan', 1400); } save(); render(); },
  't-hl': a => { const t = taskById(a.dataset.id); if (!t) return; closeSheet(); const rec = day(); if (!rec.planned.includes(t.id)) rec.planned.push(t.id); go('today'); setHighlight(t.title, t.id); },
  't-del': a => {
    const id = a.dataset.id;
    if (ui.confirm !== 't-' + id) { ui.confirm = 't-' + id; a.textContent = 'Tap again to delete'; return; }
    S.tasks = S.tasks.filter(t => t.id !== id);
    for (const d of Object.values(S.days)) d.planned = (d.planned || []).filter(x => x !== id);
    save(); closeSheet(); render();
  },
  'show-done': () => { ui.showDone = !ui.showDone; render(); },
  'clear-ex': () => {
    if (ui.confirm !== 'ex') { ui.confirm = 'ex'; render(); return; }
    const ids = new Set(S.tasks.filter(t => t.ex).map(t => t.id));
    S.tasks = S.tasks.filter(t => !t.ex); S.goals = S.goals.filter(g => !g.ex);
    for (const d of Object.values(S.days)) d.planned = (d.planned || []).filter(x => !ids.has(x));
    ui.confirm = ''; save(); render(); toast('Examples removed. The board is yours.');
  },
  hz: a => { ui.hz = a.dataset.v; render(); },
  gp: a => { const hz = ui.hz, d = +a.dataset.d; ui.gp[hz] = d === 0 ? null : shiftPeriod(hz, ui.gp[hz] || periodOf(hz, todayKey()), d); render(); },
  'g-toggle': a => { const g = goalById(a.dataset.id); if (!g) return; if (g.target && !g.done) g.progress = Math.max(g.progress, g.target); setGoalDone(g, !g.done, a.getBoundingClientRect()); render(); },
  'g-step': a => { const g = goalById(a.dataset.id); if (!g) return; setGoalProgress(g, g.progress + (+a.dataset.d), a.getBoundingClientRect()); render(); },
  'g-edit': a => { const g = goalById(a.dataset.id); if (g) mGoal(g); },
  'g-del': a => {
    const id = a.dataset.id;
    if (ui.confirm !== 'g-' + id) { ui.confirm = 'g-' + id; a.textContent = 'Tap again to delete'; return; }
    S.goals = S.goals.filter(g => g.id !== id);
    S.goals.forEach(g => { if (g.parentId === id) g.parentId = null; }); S.tasks.forEach(t => { if (t.goalId === id) t.goalId = null; });
    save(); closeSheet(); render();
  },
  'g-carry': () => {
    const hz = ui.hz, p = ui.gp[hz] || periodOf(hz, todayKey());
    const prev = goalsIn(hz, shiftPeriod(hz, p, -1)).filter(g => !g.done && !g.carried);
    prev.forEach(g => { g.carried = true; S.goals.push(Object.assign({}, g, { id: uid(), period: p, carried: false, done: false, doneKey: null, created: Date.now() })); });
    save(); render(); toast(`${plural(prev.length, 'goal')} carried over. Finish them this time.`);
  },
  prog: a => { ui.prog = a.dataset.v; ui.progOff = 0; render(); },
  'prog-nav': a => { const d = +a.dataset.d; ui.progOff = d === 0 ? 0 : Math.min(0, ui.progOff + d); render(); },
  'day-open': a => mDay(a.dataset.k),
  set: a => {
    const k = a.dataset.k; let v = a.dataset.v;
    if (v === 'true' || v === 'false') v = v === 'true';
    S.settings[k] = v; save(); applyTheme(); render();
  },
  'id-del': a => {
    S.identities = S.identities.filter(i => i.id !== a.dataset.id);
    S.habits.forEach(h => { if (h.identity === a.dataset.id) h.identity = ''; });
    S.goals.forEach(g => { if (g.identity === a.dataset.id) g.identity = ''; });
    save(); render();
  },
  export: () => { ui.exportText = JSON.stringify(S); render(); },
  'copy-export': () => {
    const box = $('#expBox');
    const fallback = () => { box.focus(); box.select(); toast('Selected. Copy it with your keyboard or long-press.'); };
    try { navigator.clipboard.writeText(ui.exportText).then(() => toast('Backup copied'), fallback); } catch (e) { fallback(); }
  },
  'import-paste': () => importData($('#impBox').value),
  reset: () => {
    if (ui.confirm !== 'reset') { ui.confirm = 'reset'; render(); return; }
    S = defaults(); saveNow(); ui.confirm = ''; ui.exportText = ''; ob.step = 0; onboard(); go('today');
  },
  onboard: () => { ob.step = 0; onboard(); },
  'ob-next': () => { obCollect(); ob.step++; onboard(); $('#onb').scrollTo(0, 0); },
  'ob-back': () => { obCollect(); ob.step = Math.max(0, ob.step - 1); onboard(); },
  'ob-finish': () => { obCollect(); S.onboarded = true; saveNow(); $('#onb').hidden = true; go('today'); toast('Day one. Pick your Highlight and cast your first vote.', 3200); },
};

const FORMS = {
  hl: f => setHighlight(f.elements.text.value),
  'quick-plan': f => {
    const title = f.elements.title.value.trim(); if (!title) return;
    const col = S.tasks.filter(t => t.urgency === 'routine');
    const t = { id: uid(), title, urgency: 'routine', due: null, notes: '', goalId: null, created: Date.now(), done: null, doneKey: null, order: col.length ? Math.min(...col.map(x => x.order)) - 1 : 0 };
    S.tasks.push(t); day().planned.push(t.id); save(); render(); setTimeout(() => { const i = $('#qpTitle'); i && i.focus(); }, 0);
  },
  'task-new': f => {
    const title = f.elements.title.value.trim(); if (!title) return;
    const urgency = (f.querySelector('input[name=urgency]:checked') || {}).value || 'routine';
    const col = S.tasks.filter(t => t.urgency === urgency);
    S.tasks.push({ id: uid(), title, urgency, due: f.elements.due.value || null, notes: '', goalId: null, created: Date.now(), done: null, doneKey: null, order: col.length ? Math.min(...col.map(x => x.order)) - 1 : 0 });
    save(); render(); toast(`Added to ${URG_NAME[urgency]}`, 1400); setTimeout(() => { const i = $('#tnTitle'); i && i.focus(); }, 0);
  },
  task: f => {
    const t = taskById(f.dataset.id); if (!t) return;
    const e = f.elements;
    const u = (f.querySelector('input[name=urgency]:checked') || {}).value || t.urgency;
    if (u !== t.urgency) { const col = S.tasks.filter(x => x.urgency === u); t.order = col.length ? Math.min(...col.map(x => x.order)) - 1 : 0; }
    Object.assign(t, { title: e.title.value.trim() || t.title, urgency: u, due: e.due.value || null, goalId: e.goal.value || null, notes: e.notes.value, ex: false });
    save(); closeSheet(); render();
  },
  habit: f => {
    const e = f.elements, id = f.dataset.id;
    const days = $$('input[name=days]:checked', f).map(i => +i.value);
    const data = { name: e.name.value.trim(), routine: e.routine.value, xp: clamp(+e.xp.value || 20, 5, 100), full: e.full.value.trim(), min: e.min.value.trim(), cue: e.cue.value.trim(), time: e.time.value.trim(), loc: e.loc.value.trim(), identity: e.identity.value, energy: e.energy.value, days: days.length ? days : ALL_DAYS.slice(), laws: { obvious: e.obvious.value.trim(), attractive: e.attractive.value.trim(), easy: e.easy.value.trim(), satisfying: e.satisfying.value.trim() } };
    if (!data.name) return;
    const h = id && habitById(id);
    if (h) Object.assign(h, data); else S.habits.push(Object.assign({ id: 'h-' + uid(), since: todayKey() }, data));
    save(); closeSheet(); ui.htab = data.routine; render(); toast(h ? 'Habit saved' : 'Habit added. Make it obvious, attractive, easy, satisfying.');
  },
  bad: f => {
    const e = f.elements, id = f.dataset.id;
    const data = { name: e.name.value.trim(), unit: (f.querySelector('input[name=unit]:checked') || {}).value || 'times', invisible: e.invisible.value.trim(), unattractive: e.unattractive.value.trim(), difficult: e.difficult.value.trim(), unsatisfying: e.unsatisfying.value.trim() };
    if (!data.name) return;
    const b = id && badById(id);
    if (b) Object.assign(b, data); else S.bad.push(Object.assign({ id: 'b-' + uid(), since: todayKey() }, data));
    save(); closeSheet(); render();
  },
  slip: f => {
    const id = (f.querySelector('input[name=bad]:checked') || {}).value, b = badById(id); if (!b) return;
    const amount = clamp(Math.round(+f.elements.amount.value || 1), 1, 600);
    const rec = day();
    rec.slips.push({ badId: b.id, t: Date.now(), amount: b.unit === 'min' ? amount : 1, trig: $$('input[name=trig]:checked', f).map(i => i.value), note: f.elements.note.value.trim() });
    if (b.unit !== 'min' && amount > 1) for (let i = 1; i < amount; i++) rec.slips.push({ badId: b.id, t: Date.now(), amount: 1, trig: [], note: '' });
    save(); closeSheet(); render();
    const st = badStats(b);
    toast(b.unit === 'min' ? `Logged. ${fmtMin(st.week.a)} this week${st.perYear >= 60 ? `, about ${Math.round(st.perYear / 60)} hours a year at this rate` : ''}. Don’t miss twice.` : `Logged. ${st.week.a}× this week. Make the next one difficult.`, 4200);
  },
  block: f => {
    const e = f.elements, rec = day();
    const s = toMin(e.start.value), en = toMin(e.end.value);
    if (s === null || en === null || en <= s) { toast('The end time needs to be after the start time.'); return; }
    let label = e.label.value.trim();
    const link = e.link ? e.link.value : '';
    if (link === 'hl' && rec.highlight) label = label || `★ ${rec.highlight.text}`;
    else if (link) { const t = taskById(link); if (t) label = label || t.title; }
    if (!label) label = 'Focus block';
    rec.blocks.push({ id: uid(), start: e.start.value, end: e.end.value, label, link: link || null, done: false });
    save(); closeSheet(); render();
  },
  laser: f => laserStart(+(f.querySelector('input[name=min]:checked') || {}).value || 25, f.elements.label.value.trim() || 'Deep work'),
  'goal-new': f => {
    const e = f.elements, title = e.title.value.trim(); if (!title) return;
    const hz = ui.hz, p = ui.gp[hz] || periodOf(hz, todayKey());
    const target = Math.round(+e.target.value) || null;
    S.goals.push({ id: uid(), title, horizon: hz, period: p, target: target && target > 0 ? target : null, unit: e.unit.value.trim(), progress: 0, done: false, doneKey: null, parentId: e.parent ? e.parent.value || null : null, identity: e.identity.value, notes: '', created: Date.now() });
    save(); render(); toast(`${HZ_NAME[hz]} goal added`);
  },
  goal: f => {
    const g = goalById(f.dataset.id); if (!g) return;
    const e = f.elements, target = Math.round(+e.target.value) || null;
    Object.assign(g, { title: e.title.value.trim() || g.title, target: target && target > 0 ? target : null, unit: e.unit.value.trim(), parentId: e.parent ? e.parent.value || null : g.parentId, identity: e.identity.value, notes: e.notes.value, ex: false });
    setGoalProgress(g, e.progress.value, null);
    closeSheet(); render();
  },
  reflect: f => {
    const e = f.elements, rec = day(), first = !rec.reflection;
    rec.reflection = { t: Date.now(), energy: +((f.querySelector('input[name=energy]:checked') || {}).value || 0) || null, focus: +((f.querySelector('input[name=focus]:checked') || {}).value || 0) || null, win: e.win.value.trim(), blocks: $$('input[name=block]:checked', f).map(i => i.value), adjust: e.adjust.value.trim(), tomorrow: e.tomorrow.value.trim(), grateful: e.grateful.value.trim() };
    save();
    if (first) {
      const k = todayKey(), sc = dayScore(k), ys = dayScore(addDays(k, -1));
      award('reflect', 'reflect', 'Evening reflection', XP.reflect, f.querySelector('button').getBoundingClientRect(), 'Day closed. Rest well. Tomorrow you go again.');
      if (ys !== null && sc > ys) setTimeout(() => award('beat', 'beat', `Better than yesterday (${sc} vs ${ys})`, XP.beat, null, `Better than yesterday: ${sc} vs ${ys}. +${XP.beat} bonus XP`), 900);
    } else toast('Reflection updated');
    go('today');
  },
  ids: f => {
    S.identities.forEach(i => { const inp = f.elements['id-' + i.id]; if (inp) i.text = inp.value.trim() || i.text; });
    const nv = f.elements['id-new'].value.trim(); if (nv) S.identities.push({ id: 'i-' + uid(), text: nv });
    save(); render(); toast('Identity statements saved');
  },
  prefs: f => {
    const e = f.elements;
    S.name = e.name.value.trim(); S.settings.wake = e.wake.value || S.settings.wake; S.settings.bed = e.bed.value || S.settings.bed; S.settings.rollover = +e.rollover.value;
    save(); render(); toast('Saved');
  },
};

function importData(txt) {
  try {
    const d = JSON.parse(txt);
    if (!d || !d.v || !Array.isArray(d.habits)) throw new Error('bad');
    S = migrate(d); saveNow(); applyTheme(); ui.exportText = ''; go('today'); toast('Backup restored');
  } catch (e) { toast('That doesn’t look like a Discipline OS backup. Check you copied all of it.'); }
}
function applyTheme() {
  const r = document.documentElement;
  if (S.settings.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.settings.theme);
}

/* =========================================================
   Drag and drop between urgency columns (pointer events, works with touch)
   ========================================================= */
let drag = null;
function dragStart(e, grip) {
  const card = grip.closest('.tcard'), col = card && card.closest('[data-col]');
  if (!card || !col) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  document.body.appendChild(ghost);
  card.classList.add('lifted');
  drag = { id: card.dataset.id, card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, pid: e.pointerId, raf: 0, from: col.dataset.col };
  document.body.classList.add('dragging');
  drag.raf = requestAnimationFrame(dragScroll);
  vibrate(8);
}
function dragMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const el = document.elementFromPoint(e.clientX, e.clientY), col = el && el.closest('[data-col]');
  $$('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  if (!col) return;
  col.classList.add('over');
  const list = $('.clist', col);
  const cards = $$('.tcard', list).filter(c => c !== drag.card);
  const before = cards.find(c => { const rr = c.getBoundingClientRect(); return e.clientY < rr.top + rr.height / 2; });
  if (before) { if (drag.card.nextSibling !== before) list.insertBefore(drag.card, before); }
  else if (list.lastElementChild !== drag.card) list.appendChild(drag.card);
}
function dragScroll() {
  if (!drag) return;
  const m = 90, sp = 14;
  if (drag.y < m) window.scrollBy(0, -sp * (1 - drag.y / m));
  else if (drag.y > innerHeight - m) window.scrollBy(0, sp * (1 - (innerHeight - drag.y) / m));
  drag.raf = requestAnimationFrame(dragScroll);
}
function dragEnd(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  cancelAnimationFrame(drag.raf);
  const list = drag.card.parentElement, col = list && list.closest('[data-col]');
  drag.ghost.remove(); document.body.classList.remove('dragging');
  $$('.col.over').forEach(c => c.classList.remove('over'));
  if (col) {
    const u = col.dataset.col, ids = $$('.tcard', list).map(c => c.dataset.id);
    ids.forEach((id, i) => { const t = taskById(id); if (t) { t.urgency = u; t.order = i; } });
    const t = taskById(drag.id);
    if (t && drag.from !== u) toast(`Moved to ${URG_NAME[u]}`, 1400);
    save();
  }
  drag = null; render();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target.id === 'modal') closeSheet(); return; }
  const fn = ACT[a.dataset.act];
  if (fn) fn(a, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind === 'sleep') { const rec = day(); rec.sleep = t.value === '' ? null : clamp(+t.value, 0, 16); save(); render(); }
  if (t.dataset.bind === 'goal') { const g = goalById(t.dataset.id); if (g) { setGoalProgress(g, t.value, t.getBoundingClientRect()); render(); } }
  if (t.id === 'impFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(t.files[0]); t.value = ''; }
});
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]');
  if (g && g.closest('.board')) dragStart(e, g);
});
document.addEventListener('pointermove', dragMove, { passive: false });
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) closeSheet();
  else if (!$('#urge').hidden) urgeClose();
});
document.addEventListener('visibilitychange', () => {
  const f = S.focusRun;
  if (document.hidden) { if (f && !f.pausedAt) { f.leaves++; saveNow(); } saveNow(); }
  else {
    if (f && !$('#laser').hidden && f.leaves) $('#lzMsg').textContent = `You left the focus screen ${plural(f.leaves, 'time')}. Back to it.`;
    if (todayKey() !== lastKey) { lastKey = todayKey(); render(); }
  }
});
window.addEventListener('pagehide', saveNow);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== ui.view) go(v); });

/* Keep the page current: re-render on day rollover and refresh the time-based Today layout every minute. */
let lastKey = '';
setInterval(() => {
  if (!S) return;
  const k = todayKey();
  if (k !== lastKey) { lastKey = k; if ($('#modal').hidden) render(); }
  else if (ui.view === 'today' && $('#modal').hidden && !drag && !document.activeElement.matches('input,textarea,select')) render();
}, 60000);

/* =========================================================
   Boot
   ========================================================= */
S = load();
lastKey = todayKey();
applyTheme();
const startView = location.hash.slice(1);
ui.view = VIEWS[startView] ? startView : 'today';
render();
if (S.focusRun) showLaser();
if (!S.onboarded) onboard();
})();
</script>
</body>
</html>
