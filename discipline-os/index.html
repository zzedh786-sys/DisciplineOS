<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Discipline OS: habits, routines, goals, tasks and focus, built on Atomic Habits and Make Time. Better than yesterday.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one reading column (max 720px) on lavender paper under a sticky status bar that carries the pinned not-average line; bottom tab bar on phones, left rail from 960px. Today runs down a timeline spine: wake, daytime, evening, bed.
   Signature: the ghost race. You race yesterday's score, and the headline gets wider as you pull ahead and narrower as you fall behind.
   Colour roles: green is you and anything done; violet is actions, focus and evenings; ghost lilac is yesterday and averages; crimson is only for slips and Urgent. Text is deep violet ink, never black. */
:root{
  --bg:#F4F1F9; --surface:#FFFFFF; --surface-2:#EAE4F3; --ink:#22153D; --ink-2:#574A73; --ink-3:#6F648A; --line:#DCD3EA; --ghost:#A193C4;
  --violet:#6A3BD6; --violet-ink:#5328BE; --violet-soft:#EBE3FC; --on-violet:#FFFFFF;
  --leaf:#178A55; --leaf-ink:#0E6D42; --leaf-soft:#DAF1E4; --on-leaf:#FFFFFF;
  --good:#178A55; --good-soft:#DAF1E4; --bad:#C3344B; --bad-soft:#F9E0E5;
  --u-routine:#8A80A6; --u-semi:#6A3BD6; --u-urgent:#C3344B;
  --mint:#C9F5DF;
  --scrim:rgba(24,12,44,.46);
  --lift:0 18px 40px -22px rgba(52,24,110,.5);
  --font-d:'Anybody','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible','Verdana','Segoe UI',system-ui,sans-serif;
  --font-m:var(--font-b);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150E22; --surface:#1F1630; --surface-2:#2A2040; --ink:#EEE8FA; --ink-2:#BBAED6; --ink-3:#9A8DB6; --line:#352A4D; --ghost:#76699A;
    --violet:#A88BFF; --violet-ink:#C0AAFF; --violet-soft:#30244F; --on-violet:#170C30;
    --leaf:#55D89C; --leaf-ink:#7AE4B4; --leaf-soft:#12352A; --on-leaf:#062013;
    --good:#55D89C; --good-soft:#12352A; --bad:#F2798D; --bad-soft:#3E1A26;
    --u-routine:#8C80A8; --u-semi:#A88BFF; --u-urgent:#F2798D;
    --mint:#C9F5DF;
    --scrim:rgba(0,0,0,.62);
    --lift:0 18px 40px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150E22; --surface:#1F1630; --surface-2:#2A2040; --ink:#EEE8FA; --ink-2:#BBAED6; --ink-3:#9A8DB6; --line:#352A4D; --ghost:#76699A;
  --violet:#A88BFF; --violet-ink:#C0AAFF; --violet-soft:#30244F; --on-violet:#170C30;
  --leaf:#55D89C; --leaf-ink:#7AE4B4; --leaf-soft:#12352A; --on-leaf:#062013;
  --good:#55D89C; --good-soft:#12352A; --bad:#F2798D; --bad-soft:#3E1A26;
  --u-routine:#8C80A8; --u-semi:#A88BFF; --u-urgent:#F2798D;
  --mint:#C9F5DF;
  --scrim:rgba(0,0,0,.62);
  --lift:0 18px 40px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
@property --w{syntax:'<number>';inherits:true;initial-value:100}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-b);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-d);font-weight:780;font-variation-settings:'wdth' 80;letter-spacing:-.01em;line-height:1.06;margin:0;text-wrap:balance}
h2{font-size:25px}
h3{font-size:18px;font-weight:740}
p{margin:0}
b{font-weight:700}
.eyebrow{font-size:14px;line-height:1.35;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:15px}
.tiny{font-size:13.5px;line-height:1.45}
.mono{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font:820 19px/1 var(--font-d);font-variation-settings:'wdth' 72;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:20px;flex:none}
.hud{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.streak{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--surface);white-space:nowrap}
.streak svg{width:14px;height:14px;color:var(--leaf)}
.streak .w{font-weight:400;color:var(--ink-2)}
.lvchip{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface)}
.lvchip .lv{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:var(--violet);color:var(--on-violet);font:800 14px/1 var(--font-d)}
.lvchip .meta{display:grid;gap:4px;min-width:0}
.lvchip .rk{font-size:13px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.lvchip .bar{width:86px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lvchip .bar i{display:block;height:100%;background:var(--leaf);transition:width .4s}
.lvchip .xp{font-size:13px;color:var(--ink-3);white-space:nowrap}
.lvchip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.06)}}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
@media (max-width:540px){.lvchip .rk,.lvchip .xp,.streak .w{display:none}.lvchip{padding-right:10px}.lvchip .bar{width:52px}}

.pin{display:block;width:100%;text-align:left;background:var(--surface-2);color:var(--ink)}
.pin-in{max-width:1120px;margin:0 auto;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pin svg{width:22px;height:14px;flex:none;align-self:center}
.pin .pt{font:760 15px/1.3 var(--font-d);font-variation-settings:'wdth' 78;min-width:0;flex:1 1 220px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .pa{font-size:13px;color:var(--ink-3);white-space:nowrap}

.shell{max-width:1120px;margin:0 auto}
.rail{display:none}
main{max-width:720px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
.tab{position:relative;display:grid;justify-items:center;gap:2px;padding:10px 2px 9px;font-size:12px;font-weight:700;color:var(--ink-3);text-decoration:none}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--violet)}
.tabbar .tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--leaf)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail{display:grid;align-content:start;gap:2px;position:sticky;top:calc(var(--hdr,58px) + env(safe-area-inset-top,0px));padding-top:20px;height:max-content}
  .rail .tab{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:15px}
  .rail .tab:hover{background:var(--surface)}
  .rail .tab.on{background:var(--surface)}
  .rail hr{border:0;border-top:1px solid var(--line);margin:10px 14px;width:auto}
  .tabbar{display:none}
  main{margin:0;padding-left:0;padding-right:0;padding-bottom:72px}
}

/* ---------- sections and trays ---------- */
.card{display:grid;gap:14px;min-width:0}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ch>div{min-width:0}
.ch .side,.meta{font-size:14px;line-height:1.35;color:var(--ink-3);text-align:right}
.ch .side br{display:none}
.titlerow{display:flex;align-items:center;gap:10px}
.sun,.moon{display:none}
.tray{background:var(--surface);border-radius:18px;padding:4px 16px;min-width:0}
.note{font-size:13.5px;line-height:1.45;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--violet);color:var(--on-violet)}
.btn.leaf{background:var(--leaf);color:var(--on-leaf)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%;white-space:normal;text-align:center}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--ink-2);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.25;max-width:100%;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on,.chip:has(input:checked){background:var(--ink);color:var(--bg);box-shadow:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip small{color:inherit;opacity:.72;font-size:12.5px}
label.chip{cursor:pointer;position:relative}
label.chip:has(input:focus-visible){outline:2.5px solid var(--violet);outline-offset:2px}

.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 14px;border-radius:999px;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}

.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=number],input[type=time],input[type=date],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.35;color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.inline{display:flex;gap:8px;min-width:0}
.inline>input{flex:1}

.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--violet);transition:width .35s}
.bar.good i,.bar.leaf i{background:var(--leaf)}
.empty{padding:16px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3);font-size:14.5px;text-align:center}
.tray>.empty{margin:12px 0;box-shadow:none;padding:8px}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.ex{font-size:12px;font-weight:400;color:var(--ink-3);border:1px dashed var(--ghost);border-radius:999px;padding:1px 7px;vertical-align:1px;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
details>summary{cursor:pointer;font-size:14.5px;font-weight:700;color:var(--ink-2);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"− "}

/* ---------- the ghost race (Today hero) ---------- */
.race{display:grid;gap:10px;padding-top:6px}
.race-date{font-size:15px;color:var(--ink-2)}
.race-h{--fs:clamp(40px,11vw,74px);font:860 calc(var(--fs) * (1.3 - var(--w) * .003))/.92 var(--font-d);font-variation-settings:'wdth' var(--w);letter-spacing:-.02em;text-wrap:balance;transition:--w .8s cubic-bezier(.2,.8,.2,1);overflow-wrap:break-word}
.race-sub{font-size:16px;color:var(--ink-2);max-width:46ch}
.track{display:grid;grid-template-columns:auto minmax(0,1fr) 2.6em;align-items:center;gap:10px 12px;margin:14px 0 30px}
.track .tl{font-size:14px;font-weight:700;color:var(--ink-2)}
.track .tn{font:860 26px/1 var(--font-d);font-variation-settings:'wdth' 90;text-align:right}
.track .tn.g{color:var(--ink-3);font-weight:700;font-size:22px}
.track .r1{grid-row:1} .track .r2{grid-row:2}
.track .tl{grid-column:1} .track .tn{grid-column:3}
.lane{grid-column:2;height:20px;border-radius:999px;background:var(--surface);position:relative;overflow:hidden}
.lane i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.lane.you i{background:var(--leaf)}
.lane.you i::after{content:"";position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--on-leaf)}
.lane.ghost{height:14px}
.lane.ghost i{background:repeating-linear-gradient(115deg,var(--ghost) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1.5px var(--ghost)}
.avgline{grid-column:2;grid-row:1/3;align-self:stretch;position:relative;pointer-events:none}
.avgline::before{content:"";position:absolute;left:var(--x);top:-8px;bottom:-8px;border-left:2px dashed var(--ink-3)}
.avgline span{position:absolute;top:calc(100% + 10px);left:clamp(48px,var(--x),calc(100% - 48px));transform:translateX(-50%);font-size:13px;color:var(--ink-3);white-space:nowrap}
.race-id{font-size:15px;color:var(--ink-2)}
.race-id b{color:var(--ink)}

/* ---------- quote ---------- */
.quote{margin:0;display:grid;gap:10px;padding-left:34px;position:relative}
.quote blockquote{margin:0;font:740 clamp(21px,4.6vw,28px)/1.18 var(--font-d);font-variation-settings:'wdth' 86;letter-spacing:-.01em;text-wrap:balance;max-width:30ch}
.quote::before{content:"“";position:absolute;left:-4px;top:-14px;font:900 76px/1 var(--font-d);color:var(--leaf)}
.quote figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14.5px;color:var(--ink-2)}
.quote .qtag{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.qline{margin:0;max-width:440px;display:grid;gap:6px;text-align:center}
.qline blockquote{margin:0;font:720 17px/1.3 var(--font-d);font-variation-settings:'wdth' 88;color:var(--ink);text-wrap:balance}
.qline figcaption{font-size:13.5px;color:var(--ink-3)}
#sheet .qline{margin:4px auto 0}

/* ---------- Highlight ---------- */
.hl{display:grid;gap:12px;padding:20px;border-radius:24px;background:var(--violet);color:var(--on-violet);box-shadow:var(--lift)}
.hl.won{background:var(--leaf);color:var(--on-leaf)}
.hl.set{background:var(--violet-soft);color:var(--ink);box-shadow:none}
.hl-k{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:700;opacity:.88}
.hl-text{font:820 clamp(26px,6vw,38px)/1.04 var(--font-d);font-variation-settings:'wdth' 78;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.hl.won .hl-text{text-decoration:line-through;text-decoration-thickness:3px}
.hl-from{font-size:14px;opacity:.85}
.hl .btn.on-hl{background:var(--surface);color:var(--violet-ink)}
.hl.won .btn.on-hl{color:var(--leaf-ink)}
.hl .btn.out{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.hl .link{color:inherit;opacity:.9}
.hl.set h2{font-size:28px}
.hl.set .chip{background:var(--surface);box-shadow:none}
.hl-done{display:flex;align-items:center;gap:8px;font-weight:700}

/* ---------- Today timeline ---------- */
.day{list-style:none;margin:0;padding:0;display:grid}
.slot{display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:40px}
.slot:last-child{padding-bottom:0}
.slot::before{content:"";position:absolute;left:22px;top:40px;bottom:2px;width:2px;background:var(--line)}
.slot.past::before{background:var(--ghost)}
.slot:last-child::before{display:none}
.slot .at{display:grid;justify-items:center;align-content:start;gap:7px;padding-top:3px}
.slot .at time{font:780 13px/1 var(--font-d);font-variation-settings:'wdth' 85;color:var(--ink-3)}
.slot .at i{width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--ghost);position:relative;z-index:1}
.slot.past .at i{background:var(--ghost);box-shadow:none}
.slot.now .at i{background:var(--leaf);box-shadow:0 0 0 5px var(--leaf-soft)}
.slot.now .at time{color:var(--leaf-ink)}
.slot .sl{display:grid;gap:14px;min-width:0}
.slot .nowtag{font-size:13px;font-weight:700;color:var(--leaf-ink)}
.checkin{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px}
.checkin .field{flex:0 0 auto}
.checkin input{width:92px}
.energy{display:flex;flex-wrap:wrap;gap:6px}
.en{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line)}
.en svg{width:16px;height:16px}
.en.on{background:var(--leaf-soft);color:var(--leaf-ink);box-shadow:none}
.rate{display:flex;gap:5px}
.rate button,.rate label{width:38px;height:38px;border-radius:11px;background:var(--surface);font:780 16px/38px var(--font-d);text-align:center;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.rate .on,.rate label:has(input:checked){background:var(--ink);color:var(--bg);box-shadow:none}
.rate input{position:absolute;opacity:0;pointer-events:none}
.fab{position:fixed;z-index:31;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;box-shadow:var(--lift)}
.fab svg{width:22px;height:22px;color:var(--leaf)}
@media (min-width:960px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}

/* ---------- habit rows ---------- */
.hlist{display:grid}
.hrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0}
.hrow+.hrow{box-shadow:0 -1px 0 var(--line)}
.ring{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent}

.tcard{display:grid;grid-template-columns:22px 26px minmax(0,1fr);grid-template-areas:"g k b" "g k a";gap:6px 9px;align-items:center;padding:12px 12px 12px 6px;border-radius:16px;background:var(--surface);position:relative;touch-action:pan-y}

body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

.c{display:block;height:24px;border-radius:6px;background:var(--surface-2);text-align:center;font:700 11px/24px var(--font-b);color:var(--ink-2)}

function spark(vals, avg) {
  const w = 240, h = 70, pl = 4, pr = 44, pt = 8, pb = 6, n = vals.length;
  const x = i => pl + (w - pl - pr) * (n === 1 ? 1 : i / (n - 1));
  const y = v => pt + (h - pt - pb) * (1 - v / 100);
  let d = '', pen = false, area = '', seg = [];
  const flush = () => { if (seg.length > 1) area += `M${seg[0][0]} ${y(0)}L${seg.map(p => p.join(' ')).join('L')}L${seg[seg.length - 1][0]} ${y(0)}Z`; seg = []; };
  vals.forEach((v, i) => {
    if (v === null) { pen = false; flush(); return; }
    const px = x(i).toFixed(1), py = y(v).toFixed(1);
    d += `${pen ? 'L' : 'M'}${px} ${py}`; pen = true; seg.push([px, py]);
  });
  flush();
  const last = vals[n - 1];
  const dots = vals.map((v, i) => v === null || i === n - 1 ? '' : `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.6"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily score for the last ${n} days${avg !== null ? `, your average ${avg}` : ''}">
    ${area ? `<path class="ar" d="${area}" opacity=".7"/>` : ''}
    ${avg !== null ? `<line class="avgl" x1="${pl}" x2="${w - pr + 2}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avgt" x="${w - pr + 6}" y="${y(avg) + 3}">avg ${avg}</text>` : `<text class="avgt" x="${w - pr + 6}" y="${y(50) + 3}">day 1</text>`}
    <path class="ln" d="${d}"/>${dots}
    ${last !== null ? `<circle class="endp" cx="${x(n - 1)}" cy="${y(last)}" r="4.5"/>` : ''}
  </svg>`;
}
function barChart(keys, scores, avg) {
  const w = 340, h = 160, pl = 4, pr = 52, pt = 18, pb = 22, n = keys.length, tk = todayKey();
  const bw = (w - pl - pr) / n, y = v => pt + (h - pt - pb) * (1 - v / 100);
  let out = `<line class="base" x1="${pl}" x2="${w - pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  keys.forEach((k, i) => {
    const v = scores[i], x0 = pl + i * bw + bw * 0.16, bwi = bw * 0.68;
    out += `<rect class="bx" x="${x0.toFixed(1)}" y="${y(100)}" width="${bwi.toFixed(1)}" height="${(y(0) - y(100)).toFixed(1)}" rx="4" opacity=".55"/>`;
    if (v !== null) {
      const above = avg === null || v >= avg;
      out += `<rect class="${above ? 'ab' : 'bl'}" x="${x0.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bwi.toFixed(1)}" height="${Math.max(1, y(0) - y(v)).toFixed(1)}" rx="4"/>`;
      out += `<text class="bt" x="${(x0 + bwi / 2).toFixed(1)}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle">${v}</text>`;
    }
    out += `<text class="${k === tk ? 'tod' : 'dl'}" x="${(x0 + bwi / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${DOW[dow(k)].slice(0, 2)}</text>`;
  });
  if (avg !== null) out += `<line class="avgl" x1="${pl}" x2="${w - pr + 2}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avgt" x="${w - pr + 6}" y="${y(avg) - 2}">your</text><text class="avgt" x="${w - pr + 6}" y="${y(avg) + 9}">avg ${avg}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily scores this week${avg !== null ? ` against your 30-day average of ${avg}` : ''}">${out}</svg>`;
}

function trend(cur, prev, lowerBetter, fmt = v => v) {

}
function vProgress() {

function tilesHtml(c, p, unit) {

function progWeek() {

function progMonth() {
  const tk = todayKey(), base = keyToDate(tk);

  for (let i = 0; i < (d0.getDay() + 6) % 7; i++) cells += '<span></span>';
  let strongN = 0;
  for (let d = 1; d <= nd; d++) {

let lzTimer = 0, wakeLock = null;
function laserStart(min, label) {

function lzElapsed(f) { return Date.now() - f.start - f.pausedMs - (f.pausedAt ? Date.now() - f.pausedAt : 0); }
function showLaser() {
  const f = S.focusRun; if (!f) return;
  const C = 2 * Math.PI * 46;
  $('#laser').innerHTML = `<div class="eyebrow">Laser focus, ${f.min} minutes</div>
    <div class="lbl">${esc(f.label)}</div>
    <div class="lzring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="46"/><circle class="pr" id="lzPr" cx="50" cy="50" r="46" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="clock" id="lzClock">--:--</div></div>
    <div class="lzmsg" id="lzMsg">Phone away. Just this.</div>
    ${quoteLine(pickQuote(f.id, ['discipline', 'time', 'naruto', 'dbz', 'onepiece', 'demonslayer', 'ronaldo']))}
    <div class="row"><button class="btn ghost" id="lzPause" data-act="lz-pause">Pause</button><button class="btn accent" data-act="lz-done">Finish</button><button class="btn ghost" data-act="lz-abort">Abandon</button></div>`;
  $('#laser').hidden = false; document.body.style.overflow = 'hidden';
  clearInterval(lzTimer); lzTimer = setInterval(lzTick, 250); lzTick();

}
function lzTick() {
  const f = S.focusRun; if (!f) return;
  const total = f.min * 60000, el = lzElapsed(f), rem = Math.max(0, total - el), C = 2 * Math.PI * 46;
  $('#lzClock').textContent = `${pad(Math.floor(rem / 60000))}:${pad(Math.floor(rem / 1000) % 60)}`;
  $('#lzPr').setAttribute('stroke-dashoffset', (C * (1 - el / total)).toFixed(2));

    const xp = Math.max(1, Math.round(mins / 2)) + (how === 'complete' ? 5 : 0);
    award('focus', f.id, `Laser: ${f.label} (${mins} min)`, xp, null, how === 'complete' ? `${mins} minutes of deep focus. +${xp} XP${f.leaves ? `. You left the screen ${plural(f.leaves, 'time')}` : '. Zero distractions'}` : `${mins} minutes logged. +${xp} XP`);

  if (rec.urges.length <= XP.urgeCap) award('urge', `${b.id}:${rec.urges.length}`, `Urge resisted: ${b.name}`, XP.urge, rect, 'Urge beaten. That is a vote against average.');
  else { save(); toast('Logged. The XP cap for urges is reached today; the real win is the time you kept.'); }
}

function obCollect() {
  const st = ob.step;
  if (st === 0) S.name = ($('#obName').value || '').trim();
  if (st === 1) {
    const lines = $('#obIds').value.split('\n').map(s => s.trim()).filter(Boolean);
    const old = S.identities;
    S.identities = lines.map((text, i) => ({ id: old[i] ? old[i].id : 'i-' + uid(), text }));
    const ids = new Set(S.identities.map(i => i.id));
    S.habits.forEach(h => { if (h.identity && !ids.has(h.identity)) h.identity = ''; });
  }
  if (st === 2) {
    S.settings.wake = $('#obWake').value || S.settings.wake; S.settings.bed = $('#obBed').value || S.settings.bed;
    const on = new Set($$('input[name=obh]:checked').map(i => i.value));
    S.habits = S.habits.filter(h => !HABIT_LIB.some(l => l.id === h.id) || on.has(h.id));
    HABIT_LIB.forEach(l => { if (on.has(l.id) && !S.habits.some(h => h.id === l.id)) S.habits.push(Object.assign({}, l, { laws: Object.assign({}, l.laws), days: ALL_DAYS.slice(), since: todayKey(), identity: S.identities.some(i => i.id === l.identity) ? l.identity : '' })); });
    S.habits.sort((a, b) => { const ia = HABIT_LIB.findIndex(l => l.id === a.id), ib = HABIT_LIB.findIndex(l => l.id === b.id); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  }
  if (st === 3) {
    const on = new Set($$('input[name=obb]:checked').map(i => i.value));
    S.bad = S.bad.filter(b => !BAD_LIB.some(l => l.id === b.id) || on.has(b.id));
    BAD_LIB.forEach(l => { if (on.has(l.id) && !S.bad.some(b => b.id === l.id)) S.bad.push(Object.assign({}, l, { since: todayKey() })); });
  }
  save();
}

function setHighlight(text, taskId) {
  text = String(text || '').trim(); if (!text) return;
  day().highlight = { text, taskId: taskId || null, done: false };
  save(); render(); toast('Highlight set. Block time for it, then protect it.');
}
function completeTask(t, rect) {
  if (t.done) {
    revoke('task', t.id, t.doneKey || todayKey());
    t.done = null; t.doneKey = null;
  } else {
    t.done = Date.now(); t.doneKey = todayKey();
    award('task', t.id, `Task: ${t.title}`, XP.task[t.urgency] || 10, rect, `Done. +${XP.task[t.urgency] || 10} XP`);
  }
  save();
}
function setGoalDone(g, done, rect) {
  if (done && !g.done) { g.done = true; g.doneKey = todayKey(); award('goal', g.id, `${HZ_NAME[g.horizon]} goal: ${g.title}`, XP.goal[g.horizon], rect, `${HZ_NAME[g.horizon]} goal complete. +${XP.goal[g.horizon]} XP`); }
  else if (!done && g.done) { revoke('goal', g.id, g.doneKey || todayKey()); g.done = false; g.doneKey = null; }
  save();
}
function setGoalProgress(g, v, rect) {
  g.progress = Math.max(0, Math.round(+v || 0));
  if (g.target) setGoalDone(g, g.progress >= g.target, rect);
  save();
}
function cycleUrgency(t) {
  t.urgency = { routine: 'semi', semi: 'urgent', urgent: 'routine' }[t.urgency] || 'routine';
  const col = S.tasks.filter(x => x.urgency === t.urgency && x !== t);
  t.order = col.length ? Math.min(...col.map(x => x.order)) - 1 : 0;
  save(); toast(`Now ${URG_NAME[t.urgency]}`, 1400);
}

    const hz = ui.hz, p = ui.gp[hz] || periodOf(hz, todayKey());
    const target = Math.round(+e.target.value) || null;
    S.goals.push({ id: uid(), title, horizon: hz, period: p, target: target && target > 0 ? target : null, unit: e.unit.value.trim(), progress: 0, done: false, doneKey: null, parentId: e.parent ? e.parent.value || null : null, identity: e.identity.value, notes: '', created: Date.now() });
    save(); render(); toast(`${HZ_NAME[hz]} goal added`);
  },
  goal: f => {
    const g = goalById(f.dataset.id); if (!g) return;
    const e = f.elements, target = Math.round(+e.target.value) || null;
    Object.assign(g, { title: e.title.value.trim() || g.title, target: target && target > 0 ? target : null, unit: e.unit.value.trim(), parentId: e.parent ? e.parent.value || null : g.parentId, identity: e.identity.value, notes: e.notes.value, ex: false });
    setGoalProgress(g, e.progress.value, null);
    closeSheet(); render();
  },
  reflect: f => {
    const e = f.elements, rec = day(), first = !rec.reflection;
    rec.reflection = { t: Date.now(), energy: +((f.querySelector('input[name=energy]:checked') || {}).value || 0) || null, focus: +((f.querySelector('input[name=focus]:checked') || {}).value || 0) || null, win: e.win.value.trim(), blocks: $$('input[name=block]:checked', f).map(i => i.value), adjust: e.adjust.value.trim(), tomorrow: e.tomorrow.value.trim(), grateful: e.grateful.value.trim() };
    save();
    if (first) {
      const k = todayKey(), sc = dayScore(k), ys = dayScore(addDays(k, -1));
      award('reflect', 'reflect', 'Evening reflection', XP.reflect, f.querySelector('button').getBoundingClientRect(), 'Day closed. Rest well. Tomorrow you go again.');
      if (ys !== null && sc > ys) setTimeout(() => award('beat', 'beat', `Better than yesterday (${sc} vs ${ys})`, XP.beat, null, `Better than yesterday: ${sc} vs ${ys}. +${XP.beat} bonus XP`), 900);
    } else toast('Reflection updated');
    go('today');
  },
  pin: f => {
    const v = +((f.querySelector('input[name=pin]:checked') || {}).value ?? 0), text = f.elements.pinText.value.trim();
    const typedNew = text && text !== S.settings.pinText;
    S.settings.pinText = text; S.settings.pinBy = f.elements.pinBy.value.trim();
    S.settings.pin = typedNew || (v === -1 && text) ? -1 : v === -1 ? 0 : v;
    save(); render(); toast('Pinned to Today');
  },
  quotes: f => {
    S.quotes = f.elements.mine.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = /^(.*?)\s+[—–-]\s+([^—–-]+)$/.exec(l);
      return m ? { t: m[1].replace(/^["“]|["”]$/g, ''), a: m[2].trim() } : { t: l.replace(/^["“]|["”]$/g, ''), a: '' };
    });
    if (S.quotes.length && !S.settings.quoteCats.includes('mine')) S.settings.quoteCats.push('mine');
    save(); render(); toast(`${plural(S.quotes.length, 'quote')} of your own saved`);
  },
  ids: f => {
    S.identities.forEach(i => { const inp = f.elements['id-' + i.id]; if (inp) i.text = inp.value.trim() || i.text; });
    const nv = f.elements['id-new'].value.trim(); if (nv) S.identities.push({ id: 'i-' + uid(), text: nv });
    save(); render(); toast('Identity statements saved');
  },
  prefs: f => {
    const e = f.elements;
    S.name = e.name.value.trim(); S.settings.wake = e.wake.value || S.settings.wake; S.settings.bed = e.bed.value || S.settings.bed; S.settings.rollover = +e.rollover.value;
    save(); render(); toast('Saved');
  },
};

function importData(txt) {
  try {
    const d = JSON.parse(txt);
    if (!d || !d.v || !Array.isArray(d.habits)) throw new Error('bad');
    S = migrate(d); saveNow(); applyTheme(); ui.exportText = ''; go('today'); toast('Backup restored');
  } catch (e) { toast('That doesn’t look like a Discipline OS backup. Check you copied all of it.'); }
}
function applyTheme() {
  const r = document.documentElement;
  if (S.settings.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.settings.theme);
}

/* =========================================================
   Drag and drop between urgency columns (pointer events, works with touch)
   ========================================================= */
let drag = null;
function dragStart(e, grip) {
  const card = grip.closest('.tcard'), col = card && card.closest('[data-col]');
  if (!card || !col) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  document.body.appendChild(ghost);
  card.classList.add('lifted');
  drag = { id: card.dataset.id, card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, pid: e.pointerId, raf: 0, from: col.dataset.col };
  document.body.classList.add('dragging');
  drag.raf = requestAnimationFrame(dragScroll);
  vibrate(8);
}
function dragMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const el = document.elementFromPoint(e.clientX, e.clientY), col = el && el.closest('[data-col]');
  $$('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  if (!col) return;
  col.classList.add('over');
  const list = $('.clist', col);
  const cards = $$('.tcard', list).filter(c => c !== drag.card);
  const before = cards.find(c => { const rr = c.getBoundingClientRect(); return e.clientY < rr.top + rr.height / 2; });
  if (before) { if (drag.card.nextSibling !== before) list.insertBefore(drag.card, before); }
  else if (list.lastElementChild !== drag.card) list.appendChild(drag.card);
}
function dragScroll() {
  if (!drag) return;
  const m = 90, sp = 14;
  if (drag.y < m) window.scrollBy(0, -sp * (1 - drag.y / m));
  else if (drag.y > innerHeight - m) window.scrollBy(0, sp * (1 - (innerHeight - drag.y) / m));
  drag.raf = requestAnimationFrame(dragScroll);
}
function dragEnd(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  cancelAnimationFrame(drag.raf);
  const list = drag.card.parentElement, col = list && list.closest('[data-col]');
  drag.ghost.remove(); document.body.classList.remove('dragging');
  $$('.col.over').forEach(c => c.classList.remove('over'));
  if (col) {
    const u = col.dataset.col, ids = $$('.tcard', list).map(c => c.dataset.id);
    ids.forEach((id, i) => { const t = taskById(id); if (t) { t.urgency = u; t.order = i; } });
    const t = taskById(drag.id);
    if (t && drag.from !== u) toast(`Moved to ${URG_NAME[u]}`, 1400);
    save();
  }
  drag = null; render();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target.id === 'modal') closeSheet(); return; }
  const fn = ACT[a.dataset.act];
  if (fn) fn(a, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('input', e => {
  const f = e.target.closest('form[data-form=habit]'); if (!f || LAW_KEYS.includes(e.target.name)) return;
  const el = f.elements, g = autoLaws({ name: el.name.value.trim(), full: el.full.value.trim(), min: el.min.value.trim(), cue: el.cue.value.trim(), time: el.time.value.trim(), loc: el.loc.value.trim(), identity: el.identity.value, energy: el.energy.value });
  for (const k of LAW_KEYS) el[k].placeholder = g[k];
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind === 'sleep') { const rec = day(); rec.sleep = t.value === '' ? null : clamp(+t.value, 0, 16); save(); render(); }
  if (t.dataset.bind === 'goal') { const g = goalById(t.dataset.id); if (g) { setGoalProgress(g, t.value, t.getBoundingClientRect()); render(); } }
  if (t.id === 'impFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(t.files[0]); t.value = ''; }
});
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]');
  if (g && g.closest('.board')) dragStart(e, g);
});
document.addEventListener('pointermove', dragMove, { passive: false });
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) closeSheet();
  else if (!$('#urge').hidden) urgeClose();
});
document.addEventListener('visibilitychange', () => {
  const f = S.focusRun;
  if (document.hidden) { if (f && !f.pausedAt) { f.leaves++; saveNow(); } saveNow(); }
  else {
    if (f && !$('#laser').hidden && f.leaves) $('#lzMsg').textContent = `You left the focus screen ${plural(f.leaves, 'time')}. Back to it.`;
    if (todayKey() !== lastKey) { lastKey = todayKey(); render(); }
  }
});
window.addEventListener('pagehide', saveNow);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== ui.view) go(v); });

/* Keep the page current: re-render on day rollover and refresh the time-based Today layout every minute. */
let lastKey = '';
setInterval(() => {
  if (!S) return;
  const k = todayKey();
  if (k !== lastKey) { lastKey = k; if ($('#modal').hidden) render(); }
  else if (ui.view === 'today' && $('#modal').hidden && !drag && !document.activeElement.matches('input,textarea,select')) render();
}, 60000);

/* =========================================================
   Boot
   ========================================================= */
try { new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('.top').offsetHeight + 'px')).observe($('.top')); } catch (e) {}
S = load();
S.habits.forEach(fillLaws);
lastKey = todayKey();
applyTheme();
const startView = location.hash.slice(1);
ui.view = VIEWS[startView] ? startView : 'today';
render();
if (S.focusRun) showLaser();
if (!S.onboarded) onboard();
})();
</script>
</body>
